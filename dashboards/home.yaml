# =================================================================
# HOME DASHBOARD — native `sections` layout
# Served at /dashboard-home/home.
#
# Layout philosophy: NO hard pixel-fit. Uses HA's native `sections`
# view — cards size to their content. This replaced the custom:grid-
# layout + mod-card pixel-fit design on 2026-06-11.
#
# Width fill: max_columns is 5. HA caps each sections column at ~500px
# and centers the grid, so on the 2560px wall display fewer columns
# leave wide black bars on each side (3 cols ≈ 530px bars; 5 cols ≈
# ~38px). The weather section sets column_span: 2 so it occupies two of
# those ~500px column slots (≈1020px); the other three sections span one
# each — 2 + 1 + 1 + 1 = the five column slots, all on one grid row.
#
# SPANS SUM TO max_columns, ONE GRID ROW. There are exactly four
# sections and their column_span values sum to 5 (= max_columns), so
# every section sits on the first (and only) grid row. This is
# deliberate: HA's sections view arranges sections in a row-grid and
# aligns each column's Nth section to a shared row baseline (row height =
# the tallest section in that row). The moment sections wrap to a second
# row, a tall section in row 1 turns into an inter-row GAP in every
# shorter column. By keeping the spans summing to exactly max_columns
# there is no second row to align against, so each section simply stacks
# its cards top-down and any leftover is a clean margin at the very
# bottom — no mid-column gaps, whatever the relative heights. Sections
# are balanced to come out within ~150px of each other:
#   c1 (span 2) Weather              + Openings (doors/garage/motion)
#   c2          Security/Presence    + Media (compact now-playing strips)
#   c3          Climate (up + down)  + Outdoor lights
#   c4          Office + Family Room + Kitchen lights
# A card cannot span across separate sections in `type: sections`, so the
# two-column-wide weather card is achieved by widening its whole section
# (column_span: 2), not the card. The two thermostat dials are stacked in
# c3 (upstairs over downstairs) and width-capped via card-mod so they
# read smaller than the old side-by-side split across two columns.
# YAML anchors (&climate_block, &mlight, &room_ctrl) are defined in the
# climate section (c3 — first in document order to use them) and reused
# by the lights column (c4). The Home Status section and its &status_tile
# anchor were removed (its leak/UPS signals are surfaced by the
# basement_water_leak and ups_power_events notification automations).
#
# Design language (one tile family across the board): button-card for
# sensors/status tiles, mushroom-light-card for light tiles; dark tile
# base, big icon over name over value. State drives icon color +
# background tint (intensity scales with brightness); a LEFT 4px accent
# = "active/identity" (alarm, presence, a light that's on); a FULL 2px
# border = "alert" (door/garage open, motion, leak wet, alarm triggered).
# Color semantics via theme tokens: green = safe/home/closed, red =
# open/alert, amber = lights/in-transit, blue = media/cool. Climate uses
# the native thermostat dial; weather the clock-weather-card; Sonos the
# mini-media-player (compact: artwork + name, tap for full controls).
# Light tiles use mushroom-light-card with show_brightness_control: true
# (inline slider, tap = toggle, hold = more-info); styling via
# card-mod-card in themes/home_polish.yaml.
#
# The Nest doorbell camera was removed 2026-06-13 — its cloud
# integration does not serve a still snapshot, so camera_view:snapshot
# rendered a dead black box dead-center.
#
# Iterate via the codesign sandbox (/dashboard-home-codesign/home),
# a CI-mirrored copy; see scripts/sync-home-codesign.sh.
# =================================================================

kiosk_mode:
  non_admin_settings:
    hide_header: true
    hide_sidebar: true
  user_settings:
    - users:
        - "Kiosk"
      kiosk: true

views:
  - title: Home
    path: home
    icon: mdi:monitor-dashboard
    theme: Home Polish
    type: sections
    max_columns: 5
    sections:

      # ========= COLUMN 1 (span 2): WEATHER + OPENINGS ==========
      # column_span: 2 widens this section to ≈1020px so the weather card
      # renders two columns wide; the openings tiles stay a 2-col grid and
      # so read larger (legible from across the room on the wall display).
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Weather
            heading_style: title
          # clock-weather-card v3 config. The header rows mirror v3's
          # default header, with the v2 12-hour time and date pattern set
          # explicitly. The v3 hourly forecast strip is hidden to keep the
          # v2 layout; set forecast_strip.hide: false to try it.
          - type: custom:clock-weather-card
            entity: weather.forecast_home
            sections:
              header:
                rows:
                  - segments:
                      - type: icon
                        icon: mdi:thermometer
                      - type: weather
                        attribute: temperature
                      - type: spacer
                      - type: weather
                  - font_size: 4rem
                    alignment: center
                    segments:
                      - type: time
                        time_pattern: "h:mm a"
                  - alignment: center
                    segments:
                      - type: icon
                        icon: mdi:calendar
                      - type: date
                        date_pattern: "EEEE, MMM d"
              forecast_strip:
                hide: true
              forecast_list:
                count: 5

          - type: heading
            heading: Openings
            heading_style: title
          - type: grid
            columns: 2
            square: false
            cards:
              - &door_sensor
                type: custom:button-card
                entity: binary_sensor.main_panel_front_door
                name: Front
                show_name: true
                show_state: true
                show_icon: true
                size: 44%
                tap_action: { action: more-info }
                state:
                  - value: 'on'
                    icon: mdi:door-open
                    color: 'var(--home-accent-triggered)'
                    styles:
                      card: [{ background-color: 'rgba(248, 81, 73, 0.18)' }, { border: '2px solid var(--home-accent-triggered)' }]
                  - value: 'off'
                    icon: mdi:door-closed
                    color: 'var(--home-accent-sensors)'
                    styles:
                      card: [{ background-color: 'rgba(86, 211, 100, 0.10)' }]
                  - operator: default
                    icon: mdi:door
                    color: 'var(--home-text-tertiary)'
                    styles:
                      card: [{ background-color: 'rgba(227, 179, 65, 0.10)' }]
                styles:
                  card:
                    - background: 'var(--home-bg-tile)'
                    - border-radius: '8px'
                    - border: 'none'
                    - padding: '14px 12px'
                    - min-height: '180px'
                  name:
                    - font-size: '16px'
                    - font-weight: '500'
                    - color: 'var(--home-text-secondary)'
                    - padding-top: '6px'
                  state:
                    - font-size: '18px'
                    - text-transform: 'uppercase'
                    - font-weight: '600'
                    - letter-spacing: '0.5px'
                    - padding-top: '2px'
              - <<: *door_sensor
                entity: binary_sensor.main_panel_sliding_door
                name: Sliding
                state:
                  - value: 'on'
                    icon: mdi:door-sliding-open
                    color: 'var(--home-accent-triggered)'
                    styles:
                      card: [{ background-color: 'rgba(248, 81, 73, 0.18)' }, { border: '2px solid var(--home-accent-triggered)' }]
                  - value: 'off'
                    icon: mdi:door-sliding
                    color: 'var(--home-accent-sensors)'
                    styles:
                      card: [{ background-color: 'rgba(86, 211, 100, 0.10)' }]
                  - operator: default
                    icon: mdi:door-sliding
                    color: 'var(--home-text-tertiary)'
                    styles:
                      card: [{ background-color: 'rgba(227, 179, 65, 0.10)' }]
              - <<: *door_sensor
                entity: binary_sensor.main_panel_garage_door
                name: Garage Entry
              - <<: *door_sensor
                entity: binary_sensor.main_panel_basement_door
                name: Basement
              - &garage_cover
                type: custom:button-card
                entity: cover.garage_door_1_door
                name: Garage 1
                show_name: true
                show_state: true
                show_icon: true
                size: 44%
                tap_action: { action: more-info }
                state:
                  - value: 'closed'
                    icon: mdi:garage
                    color: 'var(--home-accent-sensors)'
                    styles:
                      card: [{ background-color: 'rgba(86, 211, 100, 0.10)' }]
                  - value: 'open'
                    icon: mdi:garage-open-variant
                    color: 'var(--home-accent-triggered)'
                    styles:
                      card: [{ background-color: 'rgba(248, 81, 73, 0.18)' }, { border: '2px solid var(--home-accent-triggered)' }]
                  - operator: regex
                    value: '^(opening|closing)$'
                    icon: mdi:garage-alert-variant
                    color: 'var(--home-accent-lights)'
                    styles:
                      card: [{ background-color: 'rgba(227, 179, 65, 0.18)' }, { animation: 'pulse 1s infinite' }]
                styles:
                  card:
                    - background: 'var(--home-bg-tile)'
                    - border-radius: '8px'
                    - border: 'none'
                    - padding: '14px 12px'
                    - min-height: '180px'
                  name:
                    - font-size: '16px'
                    - font-weight: '500'
                    - color: 'var(--home-text-secondary)'
                    - padding-top: '6px'
                  state:
                    - font-size: '18px'
                    - text-transform: 'uppercase'
                    - font-weight: '600'
                    - letter-spacing: '0.5px'
                    - padding-top: '2px'
              - <<: *garage_cover
                entity: cover.garage_door_2_door
                name: Garage 2
              - &motion_sensor
                type: custom:button-card
                entity: binary_sensor.main_panel_family_room_motion
                name: Family
                show_name: true
                show_state: true
                show_icon: true
                size: 44%
                tap_action: { action: more-info }
                state:
                  - value: 'on'
                    icon: mdi:motion-sensor
                    color: 'var(--home-accent-triggered)'
                    styles:
                      card: [{ background-color: 'rgba(248, 81, 73, 0.20)' }, { animation: 'pulse 1s infinite' }]
                  - value: 'off'
                    icon: mdi:motion-sensor-off
                    color: 'var(--home-accent-sensors)'
                    styles:
                      card: [{ background-color: 'rgba(86, 211, 100, 0.10)' }]
                  - operator: default
                    icon: mdi:motion-sensor-off
                    color: 'var(--home-text-tertiary)'
                    styles:
                      card: [{ background-color: 'rgba(227, 179, 65, 0.10)' }]
                styles:
                  card:
                    - background: 'var(--home-bg-tile)'
                    - border-radius: '8px'
                    - border: 'none'
                    - padding: '14px 12px'
                    - min-height: '180px'
                  name:
                    - font-size: '16px'
                    - font-weight: '500'
                    - color: 'var(--home-text-secondary)'
                    - padding-top: '6px'
                  state:
                    - font-size: '18px'
                    - text-transform: 'uppercase'
                    - font-weight: '600'
                    - letter-spacing: '0.5px'
                    - padding-top: '2px'
              - <<: *motion_sensor
                entity: binary_sensor.main_panel_office_motion
                name: Office
            extra_styles: |
              @keyframes pulse {
                0%, 100% { opacity: 1; }
                50% { opacity: 0.7; }
              }

      # ============ COLUMN 2: SECURITY/PRESENCE + MEDIA =========
      - type: grid
        cards:
          - type: heading
            heading: Security
            heading_style: title

          # --- Alarm hero ---
          - type: custom:button-card
            entity: alarm_control_panel.home_alarm
            name: Home Alarm
            show_name: true
            show_state: true
            show_icon: true
            size: 40%
            layout: icon_name_state
            triggers_update:
              - binary_sensor.house_openings
            state_display: |
              [[[
                if (states['alarm_control_panel.home_alarm'].state === 'disarmed'
                    && states['binary_sensor.house_openings'].state === 'on') {
                  const openList = states['binary_sensor.house_openings'].attributes.open_list || '';
                  return openList ? `OPEN: ${openList}` : 'OPEN';
                }
                return entity.state.toUpperCase();
              ]]]
            tap_action: { action: more-info }
            state:
              - operator: template
                value: |
                  [[[ return states['alarm_control_panel.home_alarm'].state === 'disarmed'
                       && states['binary_sensor.house_openings'].state === 'on'; ]]]
                icon: mdi:shield-alert
                color: 'var(--home-accent-armed)'
                styles:
                  card:
                    - background-color: 'rgba(227, 179, 65, 0.20)'
                    - border-left: '4px solid var(--home-accent-armed)'
                  state:
                    - color: 'var(--home-accent-armed)'
                    - font-size: '22px'
                    - letter-spacing: '1px'
                    - white-space: 'normal'
              - value: disarmed
                icon: mdi:shield-check
                color: 'var(--home-accent-disarmed)'
                styles:
                  card:
                    - background-color: 'rgba(86, 211, 100, 0.15)'
                    - border-left: '4px solid var(--home-accent-disarmed)'
                  state: [{ color: 'var(--home-accent-disarmed)' }]
              - value: arming
                icon: mdi:shield-half-full
                color: 'var(--home-accent-armed)'
                styles:
                  card:
                    - background-color: 'rgba(227, 179, 65, 0.15)'
                    - border-left: '4px solid var(--home-accent-armed)'
                  state: [{ color: 'var(--home-accent-armed)' }]
              - operator: regex
                value: '^armed.*'
                icon: mdi:shield-lock
                color: 'var(--home-accent-armed)'
                styles:
                  card:
                    - background-color: 'rgba(227, 179, 65, 0.15)'
                    - border-left: '4px solid var(--home-accent-armed)'
                  state: [{ color: 'var(--home-accent-armed)' }]
              - operator: regex
                value: '^(pending|triggered)$'
                icon: mdi:alarm-light
                color: 'var(--home-accent-triggered)'
                styles:
                  card:
                    - background-color: 'rgba(248, 81, 73, 0.20)'
                    - border-left: '4px solid var(--home-accent-triggered)'
                    - animation: 'pulse 1.2s infinite'
                  state: [{ color: 'var(--home-accent-triggered)' }]
            styles:
              card:
                - border-radius: '10px'
                - border: 'none'
                - padding: '18px 24px'
                - background: 'var(--home-bg-card)'
              name:
                - font-size: '18px'
                - font-weight: '500'
                - color: 'var(--home-text-secondary)'
                - justify-self: start
              state:
                - font-size: '30px'
                - font-weight: '600'
                - text-transform: 'uppercase'
                - letter-spacing: '1.5px'
                - justify-self: start
              grid:
                - grid-template-areas: '"i n" "i s"'
                - grid-template-columns: 'min-content 1fr'
                - column-gap: '20px'
                - align-items: 'center'
            extra_styles: |
              @keyframes pulse {
                0%, 100% { opacity: 1; }
                50% { opacity: 0.7; }
              }

          # --- Arm/disarm action row ---
          - type: grid
            columns: 3
            square: false
            cards:
              - &arm_btn
                type: custom:button-card
                name: Arm Home
                icon: mdi:shield-home
                show_name: true
                show_icon: true
                show_state: false
                size: 36%
                layout: vertical
                tap_action:
                  action: call-service
                  service: alarm_control_panel.alarm_arm_home
                  target: { entity_id: alarm_control_panel.home_alarm }
                styles:
                  card:
                    - background: 'var(--home-bg-tile)'
                    - border-radius: '8px'
                    - border: 'none'
                    - padding: '12px 4px'
                  name:
                    - font-size: '13px'
                    - font-weight: '600'
                    - color: 'var(--home-text-secondary)'
                    - text-transform: 'uppercase'
                    - letter-spacing: '1px'
                    - padding-top: '4px'
              - <<: *arm_btn
                name: Arm Away
                icon: mdi:shield-lock
                tap_action:
                  action: call-service
                  service: alarm_control_panel.alarm_arm_away
                  target: { entity_id: alarm_control_panel.home_alarm }
              - <<: *arm_btn
                name: Disarm
                icon: mdi:shield-off
                tap_action: { action: more-info, entity: alarm_control_panel.home_alarm }

          # --- Presence: meeting indicator + Chris/Rachel ---
          - type: heading
            heading: Presence
            heading_style: subtitle

          - type: custom:button-card
            entity: light.meeting_light
            name: Rachel
            show_name: true
            show_state: false
            show_label: true
            show_icon: true
            size: 45%
            tap_action:
              action: call-service
              service: switch.toggle
              target: { entity_id: switch.meeting_button_in_meeting }
            hold_action:
              action: more-info
              entity: switch.meeting_button_in_meeting
            triggers_update:
              - person.rachel_morse
              - switch.meeting_button_in_meeting
            custom_fields:
              duration: >-
                [[[
                  if (states['person.rachel_morse']?.state === 'not_home') return '';
                  const s = states['switch.meeting_button_in_meeting']?.state;
                  if (s !== 'on' && s !== 'off') return '';
                  const lc = new Date(states['switch.meeting_button_in_meeting']?.last_changed);
                  const diffMins = Math.floor((new Date() - lc) / 60000);
                  const rel = diffMins < 1 ? 'just now'
                    : diffMins < 60 ? diffMins + ' min'
                    : Math.floor(diffMins/60) + 'h ' + (diffMins%60) + 'm';
                  return 'for ' + rel;
                ]]]
            state:
              - operator: template
                value: |
                  [[[ return states['person.rachel_morse'].state === 'not_home'; ]]]
                icon: mdi:account-off-outline
                color: 'var(--home-text-tertiary)'
                label: Not Home
                styles:
                  card:
                    - background-color: 'var(--home-bg-tile)'
                    - border-left: '4px solid var(--home-text-tertiary)'
                  label: [{ color: 'var(--home-text-tertiary)' }]
              - value: 'on'
                icon: mdi:account-voice
                color: 'var(--home-accent-triggered)'
                label: In Meeting
                styles:
                  card:
                    - background-color: 'rgba(248, 81, 73, 0.20)'
                    - border-left: '4px solid var(--home-accent-triggered)'
                    - animation: 'pulse 1.8s infinite'
                  label: [{ color: 'var(--home-accent-triggered)' }]
              - value: 'off'
                icon: mdi:account-check
                color: 'var(--home-accent-disarmed)'
                label: Available
                styles:
                  card:
                    - background-color: 'rgba(86, 211, 100, 0.12)'
                    - border-left: '4px solid var(--home-accent-disarmed)'
                  label: [{ color: 'var(--home-accent-disarmed)' }]
              - value: 'unavailable'
                icon: mdi:account-off
                color: 'var(--home-text-tertiary)'
                label: Offline
                styles:
                  card:
                    - background-color: 'rgba(227, 179, 65, 0.10)'
                    - border-left: '4px solid var(--home-accent-armed)'
                  label: [{ color: 'var(--home-text-tertiary)' }]
            styles:
              card:
                - border-radius: '10px'
                - border: 'none'
                - padding: '14px 24px'
                - background: 'var(--home-bg-card)'
              name:
                - font-size: '16px'
                - font-weight: '500'
                - color: 'var(--home-text-secondary)'
                - justify-self: start
              label:
                - font-size: '22px'
                - font-weight: '600'
                - text-transform: 'uppercase'
                - letter-spacing: '1.5px'
                - justify-self: start
              custom_fields:
                duration:
                  - font-size: '13px'
                  - color: 'var(--home-text-tertiary)'
                  - padding-top: '3px'
                  - justify-self: 'start'
              grid:
                - grid-template-areas: '"i n" "i l" "i duration"'
                - grid-template-columns: 'min-content 1fr'
                - column-gap: '20px'
                - align-items: 'center'

          - type: grid
            columns: 2
            square: false
            cards:
              - &presence_card
                type: custom:button-card
                entity: person.christopher_pitzi
                name: Chris
                show_name: true
                show_state: false
                show_label: true
                show_icon: true
                size: 45%
                tap_action: { action: more-info }
                state:
                  - value: 'home'
                    icon: mdi:account-tie
                    color: 'var(--home-accent-disarmed)'
                    label: Home
                    styles:
                      card:
                        - background-color: 'rgba(86, 211, 100, 0.12)'
                        - border-left: '4px solid var(--home-accent-disarmed)'
                      label: [{ color: 'var(--home-accent-disarmed)' }]
                  - value: 'not_home'
                    icon: mdi:account-off-outline
                    color: 'var(--home-text-tertiary)'
                    label: Away
                    styles:
                      card: [{ background-color: 'var(--home-bg-tile)' }]
                      label: [{ color: 'var(--home-text-tertiary)' }]
                  - operator: default
                    icon: mdi:account-alert-outline
                    color: 'var(--home-accent-armed)'
                    label: Unknown
                    styles:
                      card:
                        - background-color: 'rgba(227, 179, 65, 0.10)'
                        - border-left: '4px solid var(--home-accent-armed)'
                      label: [{ color: 'var(--home-accent-armed)' }]
                styles:
                  card:
                    - border-radius: '10px'
                    - border: 'none'
                    - padding: '12px 20px'
                    - background: 'var(--home-bg-card)'
                  name:
                    - font-size: '15px'
                    - font-weight: '500'
                    - color: 'var(--home-text-secondary)'
                    - justify-self: start
                  label:
                    - font-size: '20px'
                    - font-weight: '600'
                    - text-transform: 'uppercase'
                    - letter-spacing: '1.5px'
                    - justify-self: start
                  grid:
                    - grid-template-areas: '"i n" "i l"'
                    - grid-template-columns: 'min-content 1fr'
                    - column-gap: '16px'
                    - align-items: 'center'
              - <<: *presence_card
                entity: person.rachel_morse
                name: Rachel
                state:
                  - value: 'home'
                    icon: mdi:account-heart
                    color: 'var(--home-accent-disarmed)'
                    label: Home
                    styles:
                      card:
                        - background-color: 'rgba(86, 211, 100, 0.12)'
                        - border-left: '4px solid var(--home-accent-disarmed)'
                      label: [{ color: 'var(--home-accent-disarmed)' }]
                  - value: 'not_home'
                    icon: mdi:account-off-outline
                    color: 'var(--home-text-tertiary)'
                    label: Away
                    styles:
                      card: [{ background-color: 'var(--home-bg-tile)' }]
                      label: [{ color: 'var(--home-text-tertiary)' }]
                  - operator: default
                    icon: mdi:account-alert-outline
                    color: 'var(--home-accent-armed)'
                    label: Unknown
                    styles:
                      card:
                        - background-color: 'rgba(227, 179, 65, 0.10)'
                        - border-left: '4px solid var(--home-accent-armed)'
                      label: [{ color: 'var(--home-accent-armed)' }]

          - type: heading
            heading: Media
            heading_style: title
          - type: grid
            columns: 2
            square: false
            cards:
              - &media_tile
                type: custom:mini-media-player
                entity: media_player.master_bedroom
                name: Master Bedroom
                artwork: full-cover-fit
                info: scroll
                hide: { source: true, sound_mode: true, shuffle: true, runtime: true, name: false, controls: true, volume: true, power: true, progress: true, icon: true }
                tap_action: { action: more-info }
                card_mod:
                  style: |
                    ha-card {
                      height: 180px !important;
                      overflow: hidden;
                      position: relative;
                      border-radius: 6px;
                      {% set members = state_attr(config.entity, 'group_members') or [] %}
                      {% if members | length > 1 and members[0] != config.entity %}
                        opacity: 0.5;
                        filter: grayscale(0.4);
                      {% endif %}
                    }
                    {% set members = state_attr(config.entity, 'group_members') or [] %}
                    {% if members | length > 1 and members[0] != config.entity %}
                    ha-card::after {
                      content: "↳ {{ state_attr(members[0], 'friendly_name') or 'leader' }}";
                      position: absolute; bottom: 6px; left: 8px;
                      font-size: 10px; color: white;
                      text-shadow: 0 1px 2px rgba(0,0,0,0.7); z-index: 10;
                    }
                    {% endif %}
              - <<: *media_tile
                entity: media_player.office
                name: Office
              - <<: *media_tile
                entity: media_player.kitchen
                name: Kitchen
              - <<: *media_tile
                entity: media_player.dining_room
                name: Dining Room
              - <<: *media_tile
                entity: media_player.roam_2
                name: Roam 2

      # ===== COLUMN 3 (span 1): CLIMATE (up + down) + OUTDOOR =====
      # Defines &climate_block (reused for downstairs) and &mlight /
      # &room_ctrl (reused by the lights column). The thermostat dials are
      # width-capped via card-mod so the two stack vertically and read
      # smaller than the old side-by-side split across columns 3 and 4.
      - type: grid
        cards:
          - type: heading
            heading: Climate
            heading_style: title
          - type: heading
            heading: Upstairs
            heading_style: subtitle
          - &climate_block
            type: vertical-stack
            cards:
              - type: conditional
                conditions:
                  - condition: state
                    entity: climate.upstairs
                    state_not: 'off'
                card:
                  type: thermostat
                  entity: climate.upstairs
                  name: Upstairs
                  card_mod:
                    style: |
                      ha-card {
                        max-width: 260px;
                        margin-left: auto;
                        margin-right: auto;
                      }
              - type: conditional
                conditions:
                  - condition: state
                    entity: climate.upstairs
                    state: 'off'
                card:
                  type: custom:mushroom-template-card
                  entity: climate.upstairs
                  primary: |-
                    {% set t = state_attr(config.entity, "current_temperature") %}
                    {{ (t | round(1)) if t is not none else "—" }}°F
                  secondary: "Upstairs · Standby"
                  icon: mdi:thermometer
                  icon_color: blue-grey
                  fill_container: true
                  tap_action: { action: more-info }
              - type: custom:mushroom-chips-card
                alignment: center
                chips:
                  - type: template
                    icon: mdi:water-percent
                    icon_color: blue
                    content: '{% set h = states("sensor.upstairs_humidity") | float(none) %}{{ (h | round) if h is not none else "—" }}%'
                  - type: template
                    icon: mdi:thermometer
                    icon_color: amber
                    content: |-
                      {% set t = state_attr("climate.upstairs", "temperature") %}
                      {% set tl = state_attr("climate.upstairs", "target_temp_low") %}
                      {% set th = state_attr("climate.upstairs", "target_temp_high") %}
                      {% if t is not none %}Set {{ t | round }}°
                      {% elif tl is not none and th is not none %}{{ tl | round }}–{{ th | round }}°
                      {% else %}—{% endif %}
                  - type: template
                    icon: |-
                      {% set a = state_attr("climate.upstairs", "hvac_action") %}
                      {% if a == "heating" %}mdi:fire{% elif a == "cooling" %}mdi:snowflake{% elif a == "idle" %}mdi:thermometer-check{% else %}mdi:thermometer-off{% endif %}
                    icon_color: |-
                      {% set a = state_attr("climate.upstairs", "hvac_action") %}
                      {% if a == "heating" %}red{% elif a == "cooling" %}blue{% else %}grey{% endif %}
                    content: |-
                      {% set a = state_attr("climate.upstairs", "hvac_action") %}
                      {{ a | title if a else "Off" }}

          - type: heading
            heading: Downstairs
            heading_style: subtitle
          - <<: *climate_block
            cards:
              - type: conditional
                conditions:
                  - condition: state
                    entity: climate.downstairs
                    state_not: 'off'
                card:
                  type: thermostat
                  entity: climate.downstairs
                  name: Downstairs
                  card_mod:
                    style: |
                      ha-card {
                        max-width: 260px;
                        margin-left: auto;
                        margin-right: auto;
                      }
              - type: conditional
                conditions:
                  - condition: state
                    entity: climate.downstairs
                    state: 'off'
                card:
                  type: custom:mushroom-template-card
                  entity: climate.downstairs
                  primary: |-
                    {% set t = state_attr(config.entity, "current_temperature") %}
                    {{ (t | round(1)) if t is not none else "—" }}°F
                  secondary: "Downstairs · Standby"
                  icon: mdi:thermometer
                  icon_color: blue-grey
                  fill_container: true
                  tap_action: { action: more-info }
              - type: custom:mushroom-chips-card
                alignment: center
                chips:
                  - type: template
                    icon: mdi:water-percent
                    icon_color: blue
                    content: '{% set h = states("sensor.downstairs_humidity") | float(none) %}{{ (h | round) if h is not none else "—" }}%'
                  - type: template
                    icon: mdi:thermometer
                    icon_color: amber
                    content: |-
                      {% set t = state_attr("climate.downstairs", "temperature") %}
                      {% set tl = state_attr("climate.downstairs", "target_temp_low") %}
                      {% set th = state_attr("climate.downstairs", "target_temp_high") %}
                      {% if t is not none %}Set {{ t | round }}°
                      {% elif tl is not none and th is not none %}{{ tl | round }}–{{ th | round }}°
                      {% else %}—{% endif %}
                  - type: template
                    icon: |-
                      {% set a = state_attr("climate.downstairs", "hvac_action") %}
                      {% if a == "heating" %}mdi:fire{% elif a == "cooling" %}mdi:snowflake{% elif a == "idle" %}mdi:thermometer-check{% else %}mdi:thermometer-off{% endif %}
                    icon_color: |-
                      {% set a = state_attr("climate.downstairs", "hvac_action") %}
                      {% if a == "heating" %}red{% elif a == "cooling" %}blue{% else %}grey{% endif %}
                    content: |-
                      {% set a = state_attr("climate.downstairs", "hvac_action") %}
                      {{ a | title if a else "Off" }}

          - type: heading
            heading: Outdoor
            heading_style: title
          - &room_ctrl
            type: custom:mushroom-light-card
            entity: light.outdoor
            show_brightness_control: true
            use_light_color: true
            tap_action:
              action: toggle
            hold_action:
              action: more-info
          - type: grid
            columns: 2
            square: false
            cards:
              - &mlight
                type: custom:mushroom-light-card
                entity: light.front_door
                name: Front
                show_brightness_control: true
                use_light_color: true
                tap_action:
                  action: toggle
                hold_action:
                  action: more-info
              - <<: *mlight
                entity: light.front_lantern
                name: Lantern
              - <<: *mlight
                entity: light.garage_front
                name: Garage Fr
              - <<: *mlight
                entity: light.garage_side
                name: Garage Sd
              - <<: *mlight
                entity: light.shed
                name: Shed

      # === COLUMN 4 (span 1): OFFICE + FAMILY ROOM + KITCHEN ===
      # Office (relocated here when the two climate dials merged into c3),
      # then Family Room, then Kitchen. The Home Status section that used
      # to head this column was removed (#448) — its leak/UPS signals are
      # covered by the basement_water_leak and ups_power_events automations.
      - type: grid
        cards:
          - type: heading
            heading: Office
            heading_style: title
          - <<: *room_ctrl
            entity: light.office_lights
          - type: grid
            columns: 2
            square: false
            cards:
              - <<: *mlight
                entity: light.bookcase_lamp
                name: Bookcase
              - <<: *mlight
                entity: light.corner_lamp
                name: Corner
              - <<: *mlight
                entity: light.door_lamp
                name: Door
              - <<: *mlight
                entity: light.table_lamp
                name: Table
              - <<: *mlight
                entity: light.desk_lamp_2
                name: Desk
              - <<: *mlight
                entity: light.desk_lamp_2_2
                name: Desk 2

          - type: heading
            heading: Family Room
            heading_style: title
          - <<: *room_ctrl
            entity: light.family_room
          - type: grid
            columns: 2
            square: false
            cards:
              - <<: *mlight
                entity: light.downstairs_hallway
                name: Down Hall
              - <<: *mlight
                entity: light.upstairs_hallway_light
                name: Up Hall
              - <<: *mlight
                entity: light.family_room_2
                name: Family
              - <<: *mlight
                entity: light.floor_lamp_composite
                name: Floor
          - type: heading
            heading: Kitchen
            heading_style: title
          - <<: *room_ctrl
            entity: light.kitchen
          - type: grid
            columns: 3
            square: false
            cards:
              - <<: *mlight
                entity: light.kitchen_island
                name: Island
              - <<: *mlight
                entity: light.kitchen_main
                name: Kitchen
              - <<: *mlight
                entity: light.kitchen_table
                name: Table
