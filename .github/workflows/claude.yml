# ============================================================================
# Claude Code — Interactive @claude Responder
# ============================================================================
# Thin wrapper around lentago/shared-workflows/claude-responder.yml.
# ============================================================================

name: Claude Code

on:
  issue_comment:
    types: [ created ]
  pull_request:
    types: [ opened, synchronize, labeled ]
  pull_request_review_comment:
    types: [ created ]
  issues:
    types: [ opened, edited, labeled, assigned ]
  pull_request_review:
    types: [ submitted ]

jobs:
  claude:
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    uses: lentago/shared-workflows/.github/workflows/claude-responder.yml@v1.2.3
    secrets: inherit
    with:
      allowed_tools: '"Bash,Read,Write,Edit,Glob,Grep,WebFetch,WebSearch"'
      extra_args: |
        --verbose
        --output-format stream-json
