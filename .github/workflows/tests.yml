name: Tests

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  bats:
    name: Bats
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install bats
        run: sudo apt-get update -qq && sudo apt-get install -y -qq bats poppler-utils

      # segno draws the signage QR codes; tests/signage_qr.bats regenerates
      # them to check the committed ones are current (#548).
      - name: Install PyYAML and segno
        run: python3 -m pip install --quiet pyyaml segno==1.6.6

      - name: Run bats suite
        run: bats tests/

  codesign-sync:
    name: Codesign Sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # dashboards/home-codesign.yaml is a generated mirror of home.yaml.
      # Fail the build if production moved ahead without the mirror being
      # regenerated (run scripts/sync-home-codesign.sh and commit). Keeps
      # the co-design preview from silently drifting behind the live home dashboard.
      - name: Check codesign mirrors production home dashboard
        run: scripts/sync-home-codesign.sh --check

  dashboard-entities:
    name: Dashboard Entities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Install PyYAML
        run: python3 -m pip install --quiet pyyaml

      - name: Check dashboard entity references
        # Recurses into dashboards/lentago-lab-views/ — without `find`, the
        # shell glob `dashboards/*.yaml` only matches top-level files and
        # silently skips every fleet entity inside the lens/detail
        # subview includes (#343). Excludes entity-allowlist.txt by name
        # since the script expects YAML and the allowlist is plain text.
        run: |
          python3 scripts/check-dashboard-entities.py --strict \
            --allowlist dashboards/entity-allowlist.txt \
            $(find dashboards -type f -name '*.yaml' ! -name 'entity-allowlist.txt')

  signage-packages:
    name: Signage Packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Every signage meta tag names a file that exists and that links back to
      # the piece. On a PR, a file a piece names must not change unless one of
      # its pieces changes too. A PR whose body has a line
      # `Signage-unaffected: <reason>` passes that last check with the reason
      # printed. The body comes in through an env var, never the shell text.
      - name: Check signage meta tags against the files they name
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          if [ "$EVENT_NAME" != "pull_request" ]; then
            python3 scripts/check-signage-packages.py
            exit
          fi
          reason="$(printf '%s\n' "$PR_BODY" | tr -d '\r' \
            | sed -n 's/^[[:space:]]*Signage-unaffected:[[:space:]]*//p' | head -n 1)"
          if [ -n "$reason" ]; then
            python3 scripts/check-signage-packages.py \
              --base "origin/${BASE_REF}" --skip-changed-together "$reason"
          else
            python3 scripts/check-signage-packages.py --base "origin/${BASE_REF}"
          fi

  signage-pdfs:
    name: Signage PDFs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install poppler-utils
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils

      # Renders every piece in signage/ to PDF and fails if one is not exactly
      # one US Letter page. The PDFs are attached so a facility without a
      # browser on the printer PC can print them (#548).
      - name: Render signage to PDF
        run: scripts/render-signage-pdf.sh --out signage-pdf

      - name: Upload PDFs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signage-pdfs
          path: signage-pdf/
          if-no-files-found: error
