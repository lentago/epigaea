# Sonoff Button 2 (SNZB-01) → Office lights
#
# Device IEEE: 18:69:0a:ff:fe:13:a1:01
#
# SNZB-01 ZHA events (cluster 6):
#   command: toggle  → single press
#   command: 'on'    → double press
#   command: 'off'   → long press (hold)
#
# Bindings:
#   single press → if lights are off, reset counter to 1 and apply scene 1;
#                  otherwise advance the counter (wraps 9 → 1) and apply.
#                  i.e. first click turns on, subsequent clicks cycle scenes.
#   double press → all office lights off (counter persists)
#   long press   → jump straight to scene 1 (Bright), reset counter to 1.
#                  Useful for bailing out of a colored/flicker scene without
#                  click-cycling through the rest of the catalog.
#
# The counter (counter.office_sonoff_scene) is also shared with the Zooz ZEN77
# in-wall switch (packages/office_zen77.yaml) so both controllers cycle from the
# same scene index. Single source of truth.
#
# Instruction cards: cards/office-scene-button.html is the printed card posted
# by this button; cards/office-wall-switch.html (the ZEN77 paddle) also prints
# the scene catalog below. Any change to the button presses or to the catalog
# updates those cards in the same PR (contract in cards/README.md).
#
# Static scenes (1-3) apply uniform values to all six lamps simultaneously.
# Flicker scenes (4-9) all share one parallel driver loop in
# `script.office_sonoff_candle_loop`. The loop's per-lamp branches call
# `script.office_lamp_tick` back-to-back; the tick renders one frame for
# one lamp AND owns its own inter-frame delay, so pacing couples to what
# the frame is doing.
#
# Fire scenes (4-7) model flame physics rather than uniform noise:
#
#   - Random WALK, not random jump: each tick reads the lamp's current
#     brightness and drifts ±9% from there, clamped to a 60-92% band —
#     flame wavers around where it was, it doesn't teleport.
#   - Occasional events break the calm: ~8% of ticks GUTTER (fast dip to
#     30-50%), ~12% FLARE (snap to 88-100%). Event ticks are quick
#     (90-220 ms); calm drift is slow (280-700 ms).
#   - Transition ≈ 90% of the tick delay, so the lamp slews continuously
#     into each frame instead of stepping and holding.
#   - Color tracks brightness: each scene interpolates between a deep/red
#     "dim" RGB and a paler/yellower "bright" RGB on the frame's target
#     brightness — dimmer flame reads redder, exactly like real fire.
#
#   - Candle scenes (4-6): dim/bright color pair per scene.
#   - Blue + Red Desk (7): desk lamps use the Red-candle pair, every other
#     lamp the Blue-candle pair. Same walk/gutter/flare behavior.
#   - Rainbow Sync (8): hue derived from wall-clock time, same on all
#     lamps; uniform 75-92% brightness band, fixed 180-400 ms pace.
#   - Rainbow Cascade (9): same, plus a per-lamp 60° cascade offset so the
#     rainbow ripples across the room.
#
# Each per-lamp branch also waits a random 0-300 ms startup phase so the
# lamps don't all brighten or dim on the same beat; the independent
# per-tick delay draws keep them desynchronized thereafter.
#
# Scene catalog:
#   1  Bright            — all 6, 100% / 2700K  (warm general illumination)
#   2  Relax             — all 6, 40%  / 2200K  (warm, low)
#   3  Focus             — all 6, 100% / 5000K  (bright, cool)
#   4  Amber Candle      — fire flicker, rgb(255,65,0) dim → rgb(255,150,40) bright
#   5  Red Candle        — fire flicker, rgb(180,10,0) dim → rgb(255,50,10) bright
#   6  Blue Candle       — fire flicker, rgb(15,40,180) dim → rgb(70,130,255) bright
#   7  Blue + Red Desk   — fire flicker; desk lamps use the Red pair, rest the Blue pair
#   8  Rainbow Sync      — flicker; hue cycles every 30 s, all lamps in unison
#   9  Rainbow Cascade   — flicker; hue cycles every 30 s, each lamp offset 60°
#
# The static Red and Blue scenes from earlier iterations were retired — the
# candle/rainbow variants cover colored lighting and clicking past two extra
# steady-color scenes to reach the more useful effects was friction. The
# Yellow, Green, and Purple candles were purged 2026-06-14 (never rested on
# in 10 days of dwell-time history — pure click-past friction); the Blue +
# Red Desk scene was added the same day, slotted next to the Blue candle.
#
# The flicker driver (mode: restart) exits when counter.office_sonoff_scene
# drops to 3 or below. Every static scene calls script.turn_off on it before
# applying. Transitioning into any flicker scene calls script.turn_on so the
# apply script fires-and-forgets — it never waits on the infinite loop.
#
# Off from outside this package (Alexa, dashboard, companion app, Assist) does
# NOT go through the handlers above, so it never stops the driver — a plain
# light.turn_off is overwritten by the next tick and the lamps carry on
# flickering. The `office_flicker_external_off_guard` automation at the bottom
# of this file closes that: any lamp going off while the loop runs kills the
# loop and re-sweeps the room off.
#
# The driver is also self-extending: HA's `repeat: while:` is capped at 10000
# iterations per block; at the tick's delay draws (fire scenes average
# ~420 ms calm-dominated, rainbows ~290 ms) each branch hits that cap after
# ~45-70 min and exits. Before this was fixed the lamps then froze on the
# last rendered frame until a paddle tap (or HA restart) re-fired the loop.
# Now, when the slowest parallel branch exits, the driver re-invokes itself
# iff counter > 3 — mode:restart cancels the dying instance cleanly, so a
# flicker scene keeps ticking indefinitely without user intervention.
#
# Live brightness: input_number.office_brightness (10-100, step 5) is the
# brightness applied by every scene. Static scenes read it directly;
# flicker tick scales its walk band by `helper / 100` (and un-scales the
# lamp's reported brightness by the same factor, so the walk position is
# invariant under hold-to-dim). apply_scene
# resets the helper to the new scene's default brightness on every tap/cycle
# (1=100, 2=40, 3=100, 4-9=100) — pass `reset_brightness: false` to render
# without touching the helper (used by ZEN77 hold-to-dim/brighten). Step 5
# keeps the ZEN77 hold-ramp visibly smooth; static scene branches add a
# 0.3 s transition so each ramp step interpolates on the bulbs.

counter:
  office_sonoff_scene:
    name: Office Sonoff Scene
    minimum: 1
    maximum: 9
    initial: 1
    step: 1
    restore: true

input_number:
  office_brightness:
    name: Office Brightness
    min: 10
    max: 100
    step: 5
    unit_of_measurement: '%'
    icon: mdi:brightness-6

script:
  office_sonoff_apply_scene:
    alias: 'Office Sonoff: Apply current scene'
    mode: restart
    fields:
      reset_brightness:
        description: >-
          When true (default), resets input_number.office_brightness to the
          new scene's default before rendering. Pass false from hold-to-dim
          handlers so the helper drives the render instead.
        default: true
    variables:
      # Office lamps to drive. While a meeting is active (light.meeting_light
      # on) light.corner_lamp is owned by the meeting indicator and is dropped
      # from the set — see packages/meeting_indicator.yaml.
      office_lamps: >-
        {% set lamps = ['light.bookcase_lamp', 'light.door_lamp',
          'light.desk_lamp_2', 'light.desk_lamp_2_2', 'light.table_lamp'] %}
        {{ lamps if is_state('light.meeting_light', 'on')
           else lamps + ['light.corner_lamp'] }}
    sequence:
      # Coerce reset_brightness to its passed value or true. The fields.default
      # above only seeds the dev-tools service form; at runtime, callers that
      # invoke this script without `data: { reset_brightness: ... }` leave the
      # variable undefined, and `{{ reset_brightness }}` renders as "" (falsy).
      # That made the reset path below silently skip on every tap-to-cycle.
      - variables:
          reset_brightness: "{{ reset_brightness | default(true) }}"
      # Scene-change path: reset helper to scene default and kill any running
      # candle loop so the choose: block below starts fresh. On hold-to-dim
      # (reset_brightness:false) we skip both — the helper is already at the
      # caller's stepped value, and a running flicker loop must keep ticking
      # so the next ~400 ms tick picks up the new helper value without a
      # visible kill/restart glitch.
      - if:
          - condition: template
            value_template: "{{ reset_brightness }}"
        then:
          - action: input_number.set_value
            target:
              entity_id: input_number.office_brightness
            data:
              value: "{{ 40 if states('counter.office_sonoff_scene') == '2' else 100 }}"
          - action: script.turn_off
            target:
              entity_id: script.office_sonoff_candle_loop
      - choose:
          - conditions: "{{ states('counter.office_sonoff_scene') == '1' }}"
            sequence:
              - action: light.turn_on
                target:
                  entity_id: '{{ office_lamps }}'
                data:
                  brightness_pct: "{{ states('input_number.office_brightness') | int(100) }}"
                  color_temp_kelvin: 2700
                  transition: 0.3
          - conditions: "{{ states('counter.office_sonoff_scene') == '2' }}"
            sequence:
              - action: light.turn_on
                target:
                  entity_id: '{{ office_lamps }}'
                data:
                  brightness_pct: "{{ states('input_number.office_brightness') | int(40) }}"
                  color_temp_kelvin: 2200
                  transition: 0.3
          - conditions: "{{ states('counter.office_sonoff_scene') == '3' }}"
            sequence:
              - action: light.turn_on
                target:
                  entity_id: '{{ office_lamps }}'
                data:
                  brightness_pct: "{{ states('input_number.office_brightness') | int(100) }}"
                  color_temp_kelvin: 5000
                  transition: 0.3
          # Scenes 4-9 are all flicker variants; the loop reads its target
          # color from a palette dict keyed on the counter, so we just turn
          # it on for any scene >= 4 and cycling between hues changes
          # color seamlessly on the next tick. Gated so hold-to-dim on a
          # running flicker scene is a no-op (the loop is already ticking,
          # the helper update reaches it on next iteration) — but if the
          # loop is OFF (e.g. revived from a dead-loop state or a fresh
          # HA boot mid-candle-scene) the hold path also restarts it so
          # the lamps don't stay frozen on the last rendered frame.
          - conditions:
              - "{{ states('counter.office_sonoff_scene') | int(0) >= 4 }}"
              - "{{ reset_brightness or is_state('script.office_sonoff_candle_loop', 'off') }}"
            sequence:
              - action: script.turn_on
                target:
                  entity_id: script.office_sonoff_candle_loop

  # Per-lamp tick: renders one frame of whatever flicker scene is active to one
  # lamp, then sleeps its own inter-frame delay (so pacing couples to the frame:
  # gutters and flares are quick, calm drift is slow). Pulled out as a sub-script
  # so the candle loop's six parallel branches stay short and so adding a new
  # flicker scene needs only a new branch in the choose: block below.
  office_lamp_tick:
    alias: 'Office Sonoff: render one tick for one lamp'
    mode: parallel
    # A tick now lives for its own delay (up to ~700 ms), so across a loop
    # kill/restart (scene cycle, self-extend) the outgoing run's six
    # sleeping ticks overlap the new run's six. 24 gives two full
    # generations of headroom; at the old cap of 12 a quick double
    # scene-cycle could hit the limit and silently drop frames.
    max: 24
    fields:
      target_entity:
        description: 'Light entity to update (e.g. light.bookcase_lamp)'
      cascade_offset:
        description: 'Hue offset (degrees) for Rainbow Cascade — ignored by other scenes'
        default: 0
    variables:
      scene: "{{ states('counter.office_sonoff_scene') | int(0) }}"
      # Live-brightness scale factor (0.1-1.0) from the helper. Fire scenes
      # multiply their walk band by it and divide the lamp's reported
      # brightness by it, so the walk position is invariant under
      # hold-to-dim. Floor of 0.1 matches the helper's min of 10.
      scale: "{{ [(states('input_number.office_brightness') | int(100)) / 100, 0.1] | max }}"
    sequence:
      - choose:
          # Scene 8 — Rainbow Sync: all lamps share the same hue, driven by
          # wall-clock time. 12 deg/sec → full cycle every 30 s. Rainbows are
          # a party effect, not fire — they keep the uniform 75-92% band and
          # steady 180-400 ms pace.
          - conditions: "{{ scene == 8 }}"
            sequence:
              - action: light.turn_on
                target:
                  entity_id: "{{ target_entity }}"
                data:
                  hs_color:
                    - "{{ (now().timestamp() * 12) % 360 }}"
                    - 100
                  brightness_pct: "{{ ((range(75, 93) | random) * (scale | float(1))) | int }}"
                  transition: 0.2
              - delay:
                  milliseconds: "{{ range(180, 400) | random }}"
          # Scene 9 — Rainbow Cascade: each lamp offset by `cascade_offset` so
          # the rainbow ripples across the room rather than moving in unison.
          - conditions: "{{ scene == 9 }}"
            sequence:
              - action: light.turn_on
                target:
                  entity_id: "{{ target_entity }}"
                data:
                  hs_color:
                    - "{{ ((now().timestamp() * 12) + cascade_offset) % 360 }}"
                    - 100
                  brightness_pct: "{{ ((range(75, 93) | random) * (scale | float(1))) | int }}"
                  transition: 0.2
              - delay:
                  milliseconds: "{{ range(180, 400) | random }}"
        default:
          # Scenes 4-7 — fire tick. Three-part model:
          #
          #  1. Behavior draw: ~8% gutter (fast dip to 30-50%), ~12% flare
          #     (snap to 88-100%), else calm random walk ±9% around the
          #     lamp's CURRENT brightness, clamped to a 60-92% band.
          #  2. Delay matches behavior: events 90-220 ms, calm 280-700 ms;
          #     transition ≈ 90% of the delay so the lamp slews continuously
          #     into each frame instead of stepping and holding.
          #  3. Color tracks brightness: interpolate the scene's dim→bright
          #     RGB pair on the frame's target brightness — a dimming flame
          #     reads redder/deeper, a flaring one paler/yellower.
          #
          # All percentages are in UNSCALED band space; `scale` is applied
          # only at the final brightness_pct (and un-applied when reading
          # the lamp), so hold-to-dim rescales the whole effect cleanly.
          - variables:
              draw: "{{ range(1, 101) | random }}"
              cur: >-
                {% set b = state_attr(target_entity, 'brightness') %}
                {{ [[((b | float(204)) / 2.55 / (scale | float(1))), 100] | min, 0] | max | round | int }}
          - variables:
              fire_target: >-
                {% if draw <= 8 %}
                  {{ range(30, 51) | random }}
                {% elif draw <= 20 %}
                  {{ range(88, 101) | random }}
                {% else %}
                  {{ [[(cur | int(80)) + (range(-9, 10) | random), 92] | min, 60] | max }}
                {% endif %}
              tick_ms: >-
                {% if draw <= 8 %}
                  {{ range(90, 161) | random }}
                {% elif draw <= 20 %}
                  {{ range(110, 221) | random }}
                {% else %}
                  {{ range(280, 701) | random }}
                {% endif %}
          - variables:
              fire_rgb: >-
                {% set pairs = {
                  '4': [[255, 65, 0],  [255, 150, 40]],
                  '5': [[180, 10, 0],  [255, 50, 10]],
                  '6': [[15, 40, 180], [70, 130, 255]]
                } %}
                {% set key = ('5' if target_entity in ['light.desk_lamp_2', 'light.desk_lamp_2_2'] else '6')
                             if scene == 7 else (scene | string) %}
                {% set p = pairs.get(key, pairs['4']) %}
                {% set n = [[((fire_target | int(80)) - 30) / 70, 1] | min, 0] | max %}
                {{ [(p[0][0] + (p[1][0] - p[0][0]) * n) | round | int,
                    (p[0][1] + (p[1][1] - p[0][1]) * n) | round | int,
                    (p[0][2] + (p[1][2] - p[0][2]) * n) | round | int] }}
          - action: light.turn_on
            target:
              entity_id: "{{ target_entity }}"
            data:
              rgb_color: "{{ fire_rgb }}"
              brightness_pct: "{{ [((fire_target | int(80)) * (scale | float(1))) | round | int, 1] | max }}"
              transition: "{{ ((tick_ms | int(400)) * 0.9 / 1000) | round(2) }}"
          - delay:
              milliseconds: "{{ tick_ms | int(400) }}"

  # Six parallel per-lamp loops. Each branch is just startup-phase delay,
  # then a tight while-loop of back-to-back tick calls — the tick renders
  # a frame AND sleeps its own behavior-matched delay before returning.
  # All scene rendering logic lives in office_lamp_tick.
  office_sonoff_candle_loop:
    alias: 'Office Sonoff: Flicker loop driver'
    mode: restart
    sequence:
      - parallel:
          - sequence:
              - delay:
                  milliseconds: "{{ range(0, 300) | random }}"
              - repeat:
                  while:
                    - condition: numeric_state
                      entity_id: counter.office_sonoff_scene
                      above: 3
                  sequence:
                    - action: script.office_lamp_tick
                      data:
                        target_entity: light.bookcase_lamp
                        cascade_offset: 0
          - sequence:
              - delay:
                  milliseconds: "{{ range(0, 300) | random }}"
              - repeat:
                  while:
                    - condition: numeric_state
                      entity_id: counter.office_sonoff_scene
                      above: 3
                    # Stop ticking corner_lamp while a meeting owns it.
                    - condition: not
                      conditions:
                        - condition: state
                          entity_id: light.meeting_light
                          state: 'on'
                  sequence:
                    - action: script.office_lamp_tick
                      data:
                        target_entity: light.corner_lamp
                        cascade_offset: 60
          - sequence:
              - delay:
                  milliseconds: "{{ range(0, 300) | random }}"
              - repeat:
                  while:
                    - condition: numeric_state
                      entity_id: counter.office_sonoff_scene
                      above: 3
                  sequence:
                    - action: script.office_lamp_tick
                      data:
                        target_entity: light.door_lamp
                        cascade_offset: 120
          - sequence:
              - delay:
                  milliseconds: "{{ range(0, 300) | random }}"
              - repeat:
                  while:
                    - condition: numeric_state
                      entity_id: counter.office_sonoff_scene
                      above: 3
                  sequence:
                    - action: script.office_lamp_tick
                      data:
                        target_entity: light.desk_lamp_2
                        cascade_offset: 180
          - sequence:
              - delay:
                  milliseconds: "{{ range(0, 300) | random }}"
              - repeat:
                  while:
                    - condition: numeric_state
                      entity_id: counter.office_sonoff_scene
                      above: 3
                  sequence:
                    - action: script.office_lamp_tick
                      data:
                        target_entity: light.desk_lamp_2_2
                        cascade_offset: 240
          - sequence:
              - delay:
                  milliseconds: "{{ range(0, 300) | random }}"
              - repeat:
                  while:
                    - condition: numeric_state
                      entity_id: counter.office_sonoff_scene
                      above: 3
                  sequence:
                    - action: script.office_lamp_tick
                      data:
                        target_entity: light.table_lamp
                        cascade_offset: 300
      # Self-extend past HA's 10000-iteration cap on `repeat:`. With our
      # 180-400 ms per-tick delays each branch's while-loop hits the cap
      # in ~30-66 min and exits silently; before this self-restart the
      # lamps then froze on the last rendered frame until something else
      # turned the loop back on (a tap-to-cycle or watchdog). Now, once
      # all six parallel branches finish, we re-invoke this script if a
      # flicker scene is still active. mode:restart cleanly cancels the
      # outgoing run, so the visible gap is sub-second. Gated on counter
      # so deliberate off / jump-to-static (1-3) terminates cleanly.
      - if:
          - condition: numeric_state
            entity_id: counter.office_sonoff_scene
            above: 3
        then:
          - action: script.turn_on
            target:
              entity_id: script.office_sonoff_candle_loop

automation:
  - id: sonoff_button_2_office_cycle
    alias: 'Sonoff Button 2: Single press → office on / cycle scenes'
    triggers:
      - trigger: event
        event_type: zha_event
        event_data:
          device_ieee: 18:69:0a:ff:fe:13:a1:01
          command: toggle
    conditions: []
    actions:
      - choose:
          - conditions:
              - condition: state
                entity_id: binary_sensor.office_lights_on
                state: 'off'
            sequence:
              - action: counter.set_value
                target:
                  entity_id: counter.office_sonoff_scene
                data:
                  value: 1
        default:
          - if:
              - condition: state
                entity_id: counter.office_sonoff_scene
                state: '9'
            then:
              - action: counter.set_value
                target:
                  entity_id: counter.office_sonoff_scene
                data:
                  value: 1
            else:
              - action: counter.increment
                target:
                  entity_id: counter.office_sonoff_scene
      - action: script.office_sonoff_apply_scene
    mode: single

  - id: sonoff_button_2_office_off
    alias: 'Sonoff Button 2: Double press → Office lights OFF'
    triggers:
      - trigger: event
        event_type: zha_event
        event_data:
          device_ieee: 18:69:0a:ff:fe:13:a1:01
          command: 'on'
    conditions: []
    variables:
      # While a meeting is active, corner_lamp is owned by the meeting indicator
      # (packages/meeting_indicator.yaml) and stays out of office-off.
      office_lamps: >-
        {% set lamps = ['light.bookcase_lamp', 'light.door_lamp',
          'light.desk_lamp_2', 'light.desk_lamp_2_2', 'light.table_lamp'] %}
        {{ lamps if is_state('light.meeting_light', 'on')
           else lamps + ['light.corner_lamp'] }}
    actions:
      - action: script.turn_off
        target:
          entity_id: script.office_sonoff_candle_loop
      - action: light.turn_off
        target:
          entity_id: '{{ office_lamps }}'
    mode: single

  - id: sonoff_button_2_office_jump_to_bright
    alias: 'Sonoff Button 2: Long press → jump to scene 1 (Bright)'
    triggers:
      - trigger: event
        event_type: zha_event
        event_data:
          device_ieee: 18:69:0a:ff:fe:13:a1:01
          command: 'off'
    conditions: []
    actions:
      - action: counter.set_value
        target:
          entity_id: counter.office_sonoff_scene
        data:
          value: 1
      - action: script.office_sonoff_apply_scene
    mode: single

  - id: office_flicker_external_off_guard
    alias: 'Office: external off stops the flicker loop'
    description: >-
      Makes "turn off the office lights" work from outside the ZEN77 paddle and
      the Sonoff button. Both of those handlers call script.turn_off on the
      candle loop before turning the lamps off; Alexa, the dashboard, the
      companion app and Assist all call plain light.turn_off, which the loop
      overwrites on its next tick (90-700 ms later). The lamps then appear to
      ignore the off command and keep flickering. This guard watches for a
      lamp going off while the loop is running, kills the loop, and re-issues
      the off so any tick already in flight is cleaned up.
    triggers:
      # corner_lamp is deliberately absent: while a meeting is active the
      # meeting indicator owns it (packages/meeting_indicator.yaml) and turns
      # it off on its own schedule, which is not an office-off request.
      - trigger: state
        entity_id:
          - light.bookcase_lamp
          - light.door_lamp
          - light.desk_lamp_2
          - light.desk_lamp_2_2
          - light.table_lamp
        from: 'on'
        to: 'off'
    conditions:
      # The loop only ever writes light.turn_on — its deepest gutter frame is
      # 30% brightness, never off — so an on→off transition while it runs can
      # only have come from something outside the loop.
      - condition: state
        entity_id: script.office_sonoff_candle_loop
        state: 'on'
    variables:
      # Same lamp set the ZEN77 / Sonoff off handlers use: corner_lamp stays
      # out while a meeting owns it.
      office_lamps: >-
        {% set lamps = ['light.bookcase_lamp', 'light.door_lamp',
          'light.desk_lamp_2', 'light.desk_lamp_2_2', 'light.table_lamp'] %}
        {{ lamps if is_state('light.meeting_light', 'on')
           else lamps + ['light.corner_lamp'] }}
    # restart: an off command lands on all six lamps at once, so several
    # triggers fire within a few hundred ms. Only the last run needs to finish.
    mode: restart
    actions:
      - action: script.turn_off
        target:
          entity_id: script.office_sonoff_candle_loop
      # Let the six parallel branches' in-flight light.turn_on calls land
      # before the sweep, otherwise a late tick re-lights a lamp behind us.
      - delay:
          seconds: 1
      - action: light.turn_off
        target:
          entity_id: '{{ office_lamps }}'
      # The counter is deliberately left where it is, matching the paddle/button
      # off handlers. With the lamps off, the next up-tap sees
      # binary_sensor.office_lights_on == off and resets it to scene 1 anyway.
