# Hue Tap Dial (RDM002) → Kitchen Sonos
#
# Device: "Hue Tap Dial" (Signify RDM002) via ZHA
#   device_ieee: 00:17:88:01:0d:35:c4:85
#   target:      media_player.kitchen (Sonos)
#
# Repurposed 2026-10-30. Until then this dial drove the Play Room lights; those
# automations were retired and the remaining playroom scripts and guard moved
# to packages/playroom_lights.yaml.
#
# Instruction card: cards/kitchen-speaker-dial.html is the printed fridge card
# for this mapping (contract in cards/README.md). Any change to the button or
# dial behaviour below updates the card in the same PR.
#
# Dial rotation → Kitchen volume, relative steps, clamped to 0-100%.
#   Clockwise          → louder
#   Counter-clockwise  → quieter
#   Each rotation event moves the volume by STEP_PCT (2%) times a speed
#   multiplier of 1-3, derived from the event's step_size: a slow
#   turn moves 2% per event, a fast spin up to 6%. The divisor (50) and cap (3)
#   are the tuning knobs in the `points` variable below. Automation traces
#   leave out trigger-derived variables, so real step sizes from this dial
#   have to be read from a zha_event listener (Developer Tools → Events).
#   Turning up while the speaker is muted unmutes it first.
#
# Buttons. The face is four quarter buttons, numbered by the dots printed on
# them: 1 one dot, 2 two stacked, 3 three in a triangle, 4 four in a square.
# The scheme (2026-10-31): the dial moves only the Kitchen. Button 1 is the
# music, buttons 2-4 are volume; a single tap acts on the Kitchen speaker, a
# double tap on everyone sharing the Kitchen's music on the first floor, and
# a long press moves the Kitchen in or out of another room's music. Other
# rooms are within reach of their own controls, so the dial no longer pulls
# them into the Kitchen's group.
#   1          short  → play / pause
#   1          double → next track
#   1          long   → Kitchen joins the music playing nearby, or leaves
#   2          short  → volume 20%
#   3          short  → volume 30%
#   4          short  → volume 40%
#   2 / 3 / 4  double → the same preset on every first-floor room in the
#                       Kitchen's group
#   2          long   → Kitchen joins the Dining Room's music, or leaves it
#   3          long   → Kitchen joins the Office's music, or leaves it
#   4          long   → nothing (unassigned)
#   No triple presses.
#   A volume preset unmutes first. There is no mute button (it was button 4
#   until 2026-10-31); turning the dial down to 0% is the quiet path. Preset
#   levels are the `preset_volume` trigger variables. Play/pause and next
#   track follow the Sonos group coordinator, so while the Kitchen plays along
#   with another room they control that room's music too; volume from the
#   ring and from single taps stays on the Kitchen speaker alone.
#
#   Long presses are toggles on the Kitchen's group. Joining always targets
#   the coordinator of the chosen room's group, so the Kitchen takes the
#   stream as a member and never interrupts it, and it keeps its own volume,
#   as in the Sonos app. A room is joinable when its coordinator's state is
#   `playing`; a paused or idle room is passed over and nothing happens. The
#   card says so.
#   - Long 1 picks the room. The Kitchen grouped with anyone (following or
#     leading): the Kitchen leaves. The Kitchen on its own: it joins the first
#     room in its trigger's `rooms` list (Dining Room, then Office) whose
#     group is playing. When both rooms play different music the Dining
#     Room wins; long 2 and long 3 are how to choose the other.
#   - Long 2 / long 3 name the room (Dining Room / Office). The Kitchen
#     already in that room's group: the Kitchen leaves. Otherwise, when that
#     room's group is playing, the Kitchen joins it, moving out of any group
#     it was following.
#   When the Kitchen leaves a group it was following, it goes quiet and the
#   room it joined keeps playing. Leading is covered below.
#   The coordinator the Kitchen joins can be a room off the dial (the Office
#   following the Basement, say). The Kitchen follows; the dial still never
#   joins, leaves or sets the volume of the Basement, the bedroom or the
#   Roam. Group them from the Sonos app.
#   Leading is only possible when a room was added to the Kitchen from the
#   Sonos app. Leaving, or joining another room, then moves only the Kitchen,
#   and Sonos decides who coordinates the rest; the dial does not unjoin the
#   other rooms.
#   The double/triple 1 group presets (Kitchen + Dining Room, the first floor,
#   with the Kitchen as coordinator) and the long 2 / long 3 toggles that
#   pulled the Dining Room or Office into the Kitchen's group were retired
#   with this scheme: they made the Kitchen lead, and the household groups
#   those rooms from the rooms themselves. Long 2 and 3 keep their rooms but
#   now point the other way: the Kitchen goes to the room.
#
#   Entity-id caveat (lentago/epigaea#544): `media_player.office_office` is the
#   Office Playbar, a room the Kitchen can follow, and `media_player.office`
#   is the Basement Arc, which the dial must not touch. Do not "fix"
#   office_office to office here. Update the ids when #544 renames them.
#
# ZHA event signatures (PhilipsRDM002 quirk, zha-device-handlers):
#   Buttons fire on cluster 0xFC00 (64512) with commands of the form
#   `button_N_short_release` / `button_N_long_release` where N is 1-4.
#   Older or alternate quirk builds emit `N_short_release` (no `button_`
#   prefix). Both shapes are matched defensively so the automation survives
#   quirk updates.
#   The quirk derives multi-presses from a 300 ms press queue: one short
#   press emits `button_N_press` + `button_N_short_release` together once the
#   window closes; two presses inside it emit `button_N_double_press` instead
#   (no short_release, so a double never also plays / pauses); three emit
#   `button_N_triple_press`. A long press emits `button_N_hold` (repeating
#   while held) and `button_N_long_release` on let-go, never a short_release.
#   The grouping automation matches only the `button_N_*` shape, which the
#   2026-10-31 logbook confirmed live; the legacy no-prefix shape kept by the
#   older automations was never observed on this dial.
#   The dial fires `step` / `step_with_on_off` (and possibly `move` /
#   `move_with_on_off`) on cluster 8 (Level Control). args[0] = direction
#   (0 = up, 1 = down) per Zigbee spec, args[1] = step size (or rate for move).
#   The same values arrive by name in `params` (step_mode, step_size), which
#   the rotation automation reads first, falling back to args. Both carry
#   zigpy enum objects (StepMode.Down), not plain ints.
#   Triggers use `device_ieee` (persistent across device re-add) instead of
#   `device_id` (changes if device is removed/re-paired).
#
# If you ever need to see exactly what this dial emits, watch
# Tools → Events → listen for `zha_event` and rotate / press.

automation:
  # ───────────────────────── DIAL ROTATION ─────────────────────────
  - id: hue_tap_dial_rotation_kitchen_sonos_volume
    alias: 'Hue Tap Dial: dial rotation → Kitchen Sonos volume'
    description: >-
      Relative volume steps on media_player.kitchen from the Hue Tap Dial.
      Direction from step_mode, speed from step_size (event params, with
      args as the fallback), clamped to 0-100%.
    triggers:
      - trigger: event
        event_type: zha_event
        event_data:
          device_ieee: '00:17:88:01:0d:35:c4:85'
          cluster_id: 8
          command: step
      - trigger: event
        event_type: zha_event
        event_data:
          device_ieee: '00:17:88:01:0d:35:c4:85'
          cluster_id: 8
          command: step_with_on_off
      - trigger: event
        event_type: zha_event
        event_data:
          device_ieee: '00:17:88:01:0d:35:c4:85'
          cluster_id: 8
          command: move
      - trigger: event
        event_type: zha_event
        event_data:
          device_ieee: '00:17:88:01:0d:35:c4:85'
          cluster_id: 8
          command: move_with_on_off
    conditions:
      - condition: not
        conditions:
          - condition: state
            entity_id: media_player.kitchen
            state:
              - unavailable
              - unknown
    variables:
      # Each template reads the raw event itself. Do not pass
      # trigger.event.data.args through a variable of its own: ZHA's args hold
      # zigpy enums, and HA renders a variable to text before parsing it back,
      # so "[<StepMode.Down: 1>, 25, 4]" fails to parse and stays a string,
      # and indexing it reads characters, not values. params is preferred;
      # args is the fallback.
      step_size: >-
        {% set d = trigger.event.data %}
        {% set p = d.params if d.params is mapping else {} %}
        {% set a = d.args if d.args is iterable and d.args is not string else [] %}
        {% set raw = p.step_size if p.step_size is defined
           else (p.rate if p.rate is defined
           else (a[1] if a | length > 1 else 0)) %}
        {{ raw | int(0) }}
      turning_down: >-
        {% set d = trigger.event.data %}
        {% set p = d.params if d.params is mapping else {} %}
        {% set a = d.args if d.args is iterable and d.args is not string else [] %}
        {% set mode = p.step_mode if p.step_mode is defined
           else (p.move_mode if p.move_mode is defined
           else (a[0] if a | length > 0 else 0)) %}
        {{ (mode | int(-1)) == 1 or 'down' in (mode | string | lower) }}
      # Speed multiplier 1-3. Tuning knobs: the divisor and the cap.
      points: "{{ [[ (step_size / 50) | round(0, 'ceil') | int(1), 1 ] | max, 3 ] | min }}"
      step_pct: 2
      delta: "{{ (points * step_pct / 100) * (-1 if turning_down else 1) }}"
      current: "{{ state_attr('media_player.kitchen', 'volume_level') | float(0) }}"
      target_volume: "{{ [[ (current + delta) | round(2), 0 ] | max, 1 ] | min }}"
    actions:
      - if:
          - condition: state
            entity_id: media_player.kitchen
            attribute: is_volume_muted
            state: true
          - condition: template
            value_template: "{{ not turning_down }}"
        then:
          - action: media_player.volume_mute
            target:
              entity_id: media_player.kitchen
            data:
              is_volume_muted: false
      - action: media_player.volume_set
        target:
          entity_id: media_player.kitchen
        data:
          volume_level: "{{ target_volume }}"
    # queued: every rotation event is a separate relative step, applied in
    # order, and each run reads the volume the previous run left behind
    # (restart would lose steps mid-spin). Events beyond max: 10 queued runs
    # are dropped, so a very long fast spin can lose a few steps.
    mode: queued
    max: 10

  # ───────────────────────── BUTTONS ─────────────────────────
  - id: hue_tap_dial_buttons_kitchen_sonos
    alias: 'Hue Tap Dial: buttons → Kitchen Sonos play/pause, next track, volume presets'
    description: >-
      1 play/pause (short) and next track (double); 2, 3 and 4 set the
      Kitchen's volume to 20%, 30% and 40% (short presses). A preset unmutes
      first so it is never silent.
    triggers:
      - trigger: event
        id: play_pause
        event_type: zha_event
        event_data:
          device_ieee: '00:17:88:01:0d:35:c4:85'
          command: button_1_short_release
      - trigger: event
        id: play_pause
        event_type: zha_event
        event_data:
          device_ieee: '00:17:88:01:0d:35:c4:85'
          command: '1_short_release'
      # Double 1 only exists in the button_N_ shape (the 300 ms press queue).
      - trigger: event
        id: next_track
        event_type: zha_event
        event_data:
          device_ieee: '00:17:88:01:0d:35:c4:85'
          command: button_1_double_press
      - trigger: event
        id: volume_preset
        event_type: zha_event
        event_data:
          device_ieee: '00:17:88:01:0d:35:c4:85'
          command: button_2_short_release
        variables:
          preset_volume: 0.2
      - trigger: event
        id: volume_preset
        event_type: zha_event
        event_data:
          device_ieee: '00:17:88:01:0d:35:c4:85'
          command: '2_short_release'
        variables:
          preset_volume: 0.2
      - trigger: event
        id: volume_preset
        event_type: zha_event
        event_data:
          device_ieee: '00:17:88:01:0d:35:c4:85'
          command: button_3_short_release
        variables:
          preset_volume: 0.3
      - trigger: event
        id: volume_preset
        event_type: zha_event
        event_data:
          device_ieee: '00:17:88:01:0d:35:c4:85'
          command: '3_short_release'
        variables:
          preset_volume: 0.3
      - trigger: event
        id: volume_preset
        event_type: zha_event
        event_data:
          device_ieee: '00:17:88:01:0d:35:c4:85'
          command: button_4_short_release
        variables:
          preset_volume: 0.4
      - trigger: event
        id: volume_preset
        event_type: zha_event
        event_data:
          device_ieee: '00:17:88:01:0d:35:c4:85'
          command: '4_short_release'
        variables:
          preset_volume: 0.4
    conditions:
      - condition: not
        conditions:
          - condition: state
            entity_id: media_player.kitchen
            state:
              - unavailable
              - unknown
    actions:
      - choose:
          - conditions:
              - condition: trigger
                id: play_pause
            sequence:
              - action: media_player.media_play_pause
                target:
                  entity_id: media_player.kitchen
          - conditions:
              - condition: trigger
                id: next_track
            sequence:
              # A radio station or TV input has no next track; Sonos refuses
              # the skip. Nothing else follows in this run, so carry on.
              - action: media_player.media_next_track
                target:
                  entity_id: media_player.kitchen
                continue_on_error: true
          - conditions:
              - condition: trigger
                id: volume_preset
            sequence:
              - if:
                  - condition: state
                    entity_id: media_player.kitchen
                    attribute: is_volume_muted
                    state: true
                then:
                  - action: media_player.volume_mute
                    target:
                      entity_id: media_player.kitchen
                    data:
                      is_volume_muted: false
              - action: media_player.volume_set
                target:
                  entity_id: media_player.kitchen
                data:
                  volume_level: "{{ preset_volume }}"
    # queued: presses are short and ordered; a quick 2-then-4 should land on
    # 40%, not drop the second press.
    mode: queued
    max: 5

  # ───────────────────────── GROUPING ─────────────────────────
  - id: hue_tap_dial_grouping_kitchen_sonos
    alias: 'Hue Tap Dial: long 1-3 and double 2-4 → Kitchen Sonos join / leave, group volume'
    description: >-
      Long presses are toggles that move only the Kitchen. Long 1: when the
      Kitchen is grouped it leaves; on its own it joins the first playing
      group among the nearby rooms (Dining Room, then Office). Long 2 / 3:
      the Kitchen joins the Dining Room's / Office's playing group, or leaves
      it when already there. Double on 2, 3 and 4 applies the 20 / 30 / 40%
      preset to every first-floor room in the Kitchen's group. See the header
      for the full table and the #544 entity-id caveat.
    triggers:
      # ── buttons 1-3 long: join / leave (long 4 is unassigned) ──
      # rooms: where to look for playing music, in priority order.
      # any_group: leave whenever the Kitchen is grouped (long 1), rather
      # than only when it is in the named room's group (long 2 / 3).
      - trigger: event
        id: join_leave
        event_type: zha_event
        event_data:
          device_ieee: '00:17:88:01:0d:35:c4:85'
          command: button_1_long_release
        variables:
          # media_player.office_office IS the Office Playbar (#544).
          rooms:
            - media_player.dining_room
            - media_player.office_office
          any_group: true
      - trigger: event
        id: join_leave
        event_type: zha_event
        event_data:
          device_ieee: '00:17:88:01:0d:35:c4:85'
          command: button_2_long_release
        variables:
          rooms:
            - media_player.dining_room
          any_group: false
      - trigger: event
        id: join_leave
        event_type: zha_event
        event_data:
          device_ieee: '00:17:88:01:0d:35:c4:85'
          command: button_3_long_release
        variables:
          rooms:
            - media_player.office_office   # Office Playbar (#544)
          any_group: false
      # ── buttons 2-4 double: group volume presets ──
      - trigger: event
        id: group_volume
        event_type: zha_event
        event_data:
          device_ieee: '00:17:88:01:0d:35:c4:85'
          command: button_2_double_press
        variables:
          preset_volume: 0.2
      - trigger: event
        id: group_volume
        event_type: zha_event
        event_data:
          device_ieee: '00:17:88:01:0d:35:c4:85'
          command: button_3_double_press
        variables:
          preset_volume: 0.3
      - trigger: event
        id: group_volume
        event_type: zha_event
        event_data:
          device_ieee: '00:17:88:01:0d:35:c4:85'
          command: button_4_double_press
        variables:
          preset_volume: 0.4
    conditions:
      - condition: not
        conditions:
          - condition: state
            entity_id: media_player.kitchen
            state:
              - unavailable
              - unknown
    variables:
      kitchen: media_player.kitchen
      # The rooms a group volume preset may touch. Off-floor rooms in the
      # Kitchen's group (the Basement, the bedroom, the Roam) keep theirs.
      first_floor:
        - media_player.kitchen
        - media_player.dining_room
        - media_player.office_office
    actions:
      # Read the group when the run actually starts, not when it was queued,
      # so a second gesture right behind a join sees the joined topology.
      - variables:
          group: "{{ state_attr(kitchen, 'group_members') or [kitchen] }}"
      - choose:
          # ── Join / leave ──
          - conditions:
              - condition: trigger
                id: join_leave
            sequence:
              - if:
                  # Long 1: grouped at all. Long 2 / 3: already with that room.
                  - >-
                    {{ (any_group and group | count > 1)
                       or (group | select('in', rooms) | list | count > 0) }}
                then:
                  # Only the Kitchen leaves, whether it followed or led.
                  - action: media_player.unjoin
                    target:
                      entity_id: "{{ kitchen }}"
                else:
                  - variables:
                      # The coordinator of the first listed room whose group
                      # is playing, or '' when none is. HA lists a Sonos
                      # group's coordinator first in group_members.
                      host: >-
                        {%- set ns = namespace(host='') -%}
                        {%- for room in rooms -%}
                          {%- set lead = (state_attr(room, 'group_members') or [room])[0] -%}
                          {%- if not ns.host and lead != kitchen and is_state(lead, 'playing') -%}
                            {%- set ns.host = lead -%}
                          {%- endif -%}
                        {%- endfor -%}
                        {{ ns.host }}
                  - if:
                      - "{{ host != '' }}"
                    then:
                      # Join the coordinator, not the room itself: joining a
                      # room that follows someone else would pull that room
                      # out of its group first. A Kitchen following another
                      # room moves straight across.
                      - action: media_player.join
                        target:
                          entity_id: "{{ host }}"
                        data:
                          group_members:
                            - "{{ kitchen }}"
          # ── Group volume preset ──
          - conditions:
              - condition: trigger
                id: group_volume
            sequence:
              - variables:
                  targets: "{{ group | select('in', first_floor) | list }}"
              - action: media_player.volume_mute
                target:
                  entity_id: "{{ targets }}"
                data:
                  is_volume_muted: false
              - action: media_player.volume_set
                target:
                  entity_id: "{{ targets }}"
                data:
                  volume_level: "{{ preset_volume }}"
    # queued: a double press right after a join should both land, in order,
    # each reading the topology the previous one left behind.
    mode: queued
    max: 5
