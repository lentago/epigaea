# Hue Tap Dial (RDM002) → Kitchen Sonos
#
# Device: "Hue Tap Dial" (Signify RDM002) via ZHA
#   device_ieee: 00:17:88:01:0d:35:c4:85
#   target:      media_player.kitchen (Sonos)
#
# Repurposed 2026-10-30. Until then this dial drove the Play Room lights; those
# automations were retired and the remaining playroom scripts and guard moved
# to packages/playroom_lights.yaml.
#
# Instruction card: cards/kitchen-speaker-dial.html is the printed fridge card
# for this mapping (contract in cards/README.md). Any change to the button or
# dial behaviour below updates the card in the same PR.
#
# Dial rotation → Kitchen volume, relative steps, clamped to 0-100%.
#   Clockwise          → louder
#   Counter-clockwise  → quieter
#   Each rotation event moves the volume by STEP_PCT (2%) times a speed
#   multiplier of 1-3, derived from the event's step_size: a slow
#   turn moves 2% per event, a fast spin up to 6%. The divisor (50) and cap (3)
#   are the tuning knobs in the `points` variable below. Automation traces
#   leave out trigger-derived variables, so real step sizes from this dial
#   have to be read from a zha_event listener (Developer Tools → Events).
#   Turning up while the speaker is muted unmutes it first.
#
# Buttons. Short presses are the everyday controls; long presses and
# multi-presses drive Sonos grouping (added 2026-10-31).
#   1 (top)    short  → play / pause
#   2          short  → volume 20%
#   3          short  → volume 30%
#   4 (bottom) short  → volume 40%
#   A preset unmutes first. There is no mute button (it was button 4 until
#   2026-10-31); turning the dial down to 0% is the quiet path. Preset levels
#   are the `preset_volume` trigger variables in the buttons automation.
#   Play/pause follows the Sonos group coordinator when the Kitchen is
#   grouped; volume stays on the Kitchen speaker alone.
#
#   1          long   → Kitchen solo: every other room leaves the Kitchen's
#                       group (or the Kitchen leaves, when it is following
#                       another room's music)
#   2          long   → toggle Dining Room in / out of the Kitchen's group
#   3          long   → toggle Office (the Playbar) in / out
#   4          long   → nothing (unassigned)
#   1          double → Kitchen + Dining Room, both set to
#                       `preset_group_volume` (25%)
#   1          triple → the first floor: Kitchen + Dining Room + Office, same
#                       volume preset
#   2 / 3 / 4  double → the 20 / 30 / 40% preset applied to the whole group
#                       the Kitchen is in, not just the Kitchen
#   The dial groups only the first-floor rooms within earshot of it: Kitchen,
#   Dining Room and Office. The Basement, the bedroom and the Roam are not on
#   the dial (2026-10-31, when the Basement toggle and the whole-house preset
#   came off and Office moved from long 4 to long 3 so the toggles sit on
#   adjacent buttons). They are still Sonos players; group them from the app.
#   The Kitchen is always the coordinator of a preset group. Toggling a room
#   in joins it to whatever the Kitchen is currently listening to (the
#   group's coordinator), so it never interrupts playback. Unavailable rooms
#   are skipped, never joined. A toggled-in room keeps its own last volume,
#   as in the Sonos app. The preset group volume is a tuning knob:
#   `preset_group_volume` in the grouping automation.
#
#   Entity-id caveat (lentago/epigaea#544): `media_player.office_office` is the
#   Office Playbar, the room this dial groups, and `media_player.office` is
#   the Basement Arc, which the dial must not touch. Do not "fix"
#   office_office to office here. Update the ids when #544 renames them.
#
# ZHA event signatures (PhilipsRDM002 quirk, zha-device-handlers):
#   Buttons fire on cluster 0xFC00 (64512) with commands of the form
#   `button_N_short_release` / `button_N_long_release` where N is 1-4.
#   Older or alternate quirk builds emit `N_short_release` (no `button_`
#   prefix). Both shapes are matched defensively so the automation survives
#   quirk updates.
#   The quirk derives multi-presses from a 300 ms press queue: one short
#   press emits `button_N_press` + `button_N_short_release` together once the
#   window closes; two presses inside it emit `button_N_double_press` instead
#   (no short_release, so a double never also plays / pauses); three emit
#   `button_N_triple_press`. A long press emits `button_N_hold` (repeating
#   while held) and `button_N_long_release` on let-go, never a short_release.
#   The grouping automation matches only the `button_N_*` shape, which the
#   2026-10-31 logbook confirmed live; the legacy no-prefix shape kept by the
#   older automations was never observed on this dial.
#   The dial fires `step` / `step_with_on_off` (and possibly `move` /
#   `move_with_on_off`) on cluster 8 (Level Control). args[0] = direction
#   (0 = up, 1 = down) per Zigbee spec, args[1] = step size (or rate for move).
#   The same values arrive by name in `params` (step_mode, step_size), which
#   the rotation automation reads first, falling back to args. Both carry
#   zigpy enum objects (StepMode.Down), not plain ints.
#   Triggers use `device_ieee` (persistent across device re-add) instead of
#   `device_id` (changes if device is removed/re-paired).
#
# If you ever need to see exactly what this dial emits, watch
# Tools → Events → listen for `zha_event` and rotate / press.

automation:
  # ───────────────────────── DIAL ROTATION ─────────────────────────
  - id: hue_tap_dial_rotation_kitchen_sonos_volume
    alias: 'Hue Tap Dial: dial rotation → Kitchen Sonos volume'
    description: >-
      Relative volume steps on media_player.kitchen from the Hue Tap Dial.
      Direction from step_mode, speed from step_size (event params, with
      args as the fallback), clamped to 0-100%.
    triggers:
      - trigger: event
        event_type: zha_event
        event_data:
          device_ieee: '00:17:88:01:0d:35:c4:85'
          cluster_id: 8
          command: step
      - trigger: event
        event_type: zha_event
        event_data:
          device_ieee: '00:17:88:01:0d:35:c4:85'
          cluster_id: 8
          command: step_with_on_off
      - trigger: event
        event_type: zha_event
        event_data:
          device_ieee: '00:17:88:01:0d:35:c4:85'
          cluster_id: 8
          command: move
      - trigger: event
        event_type: zha_event
        event_data:
          device_ieee: '00:17:88:01:0d:35:c4:85'
          cluster_id: 8
          command: move_with_on_off
    conditions:
      - condition: not
        conditions:
          - condition: state
            entity_id: media_player.kitchen
            state:
              - unavailable
              - unknown
    variables:
      # Each template reads the raw event itself. Do not pass
      # trigger.event.data.args through a variable of its own: ZHA's args hold
      # zigpy enums, and HA renders a variable to text before parsing it back,
      # so "[<StepMode.Down: 1>, 25, 4]" fails to parse and stays a string,
      # and indexing it reads characters, not values. params is preferred;
      # args is the fallback.
      step_size: >-
        {% set d = trigger.event.data %}
        {% set p = d.params if d.params is mapping else {} %}
        {% set a = d.args if d.args is iterable and d.args is not string else [] %}
        {% set raw = p.step_size if p.step_size is defined
           else (p.rate if p.rate is defined
           else (a[1] if a | length > 1 else 0)) %}
        {{ raw | int(0) }}
      turning_down: >-
        {% set d = trigger.event.data %}
        {% set p = d.params if d.params is mapping else {} %}
        {% set a = d.args if d.args is iterable and d.args is not string else [] %}
        {% set mode = p.step_mode if p.step_mode is defined
           else (p.move_mode if p.move_mode is defined
           else (a[0] if a | length > 0 else 0)) %}
        {{ (mode | int(-1)) == 1 or 'down' in (mode | string | lower) }}
      # Speed multiplier 1-3. Tuning knobs: the divisor and the cap.
      points: "{{ [[ (step_size / 50) | round(0, 'ceil') | int(1), 1 ] | max, 3 ] | min }}"
      step_pct: 2
      delta: "{{ (points * step_pct / 100) * (-1 if turning_down else 1) }}"
      current: "{{ state_attr('media_player.kitchen', 'volume_level') | float(0) }}"
      target_volume: "{{ [[ (current + delta) | round(2), 0 ] | max, 1 ] | min }}"
    actions:
      - if:
          - condition: state
            entity_id: media_player.kitchen
            attribute: is_volume_muted
            state: true
          - condition: template
            value_template: "{{ not turning_down }}"
        then:
          - action: media_player.volume_mute
            target:
              entity_id: media_player.kitchen
            data:
              is_volume_muted: false
      - action: media_player.volume_set
        target:
          entity_id: media_player.kitchen
        data:
          volume_level: "{{ target_volume }}"
    # queued: every rotation event is a separate relative step, applied in
    # order, and each run reads the volume the previous run left behind
    # (restart would lose steps mid-spin). Events beyond max: 10 queued runs
    # are dropped, so a very long fast spin can lose a few steps.
    mode: queued
    max: 10

  # ───────────────────────── BUTTONS ─────────────────────────
  - id: hue_tap_dial_buttons_kitchen_sonos
    alias: 'Hue Tap Dial: buttons → Kitchen Sonos play/pause and volume presets'
    description: >-
      1 play/pause; 2, 3 and 4 set the volume to 20%, 30% and 40% (short
      presses). A preset unmutes first so it is never silent.
    triggers:
      - trigger: event
        id: play_pause
        event_type: zha_event
        event_data:
          device_ieee: '00:17:88:01:0d:35:c4:85'
          command: button_1_short_release
      - trigger: event
        id: play_pause
        event_type: zha_event
        event_data:
          device_ieee: '00:17:88:01:0d:35:c4:85'
          command: '1_short_release'
      - trigger: event
        id: volume_preset
        event_type: zha_event
        event_data:
          device_ieee: '00:17:88:01:0d:35:c4:85'
          command: button_2_short_release
        variables:
          preset_volume: 0.2
      - trigger: event
        id: volume_preset
        event_type: zha_event
        event_data:
          device_ieee: '00:17:88:01:0d:35:c4:85'
          command: '2_short_release'
        variables:
          preset_volume: 0.2
      - trigger: event
        id: volume_preset
        event_type: zha_event
        event_data:
          device_ieee: '00:17:88:01:0d:35:c4:85'
          command: button_3_short_release
        variables:
          preset_volume: 0.3
      - trigger: event
        id: volume_preset
        event_type: zha_event
        event_data:
          device_ieee: '00:17:88:01:0d:35:c4:85'
          command: '3_short_release'
        variables:
          preset_volume: 0.3
      - trigger: event
        id: volume_preset
        event_type: zha_event
        event_data:
          device_ieee: '00:17:88:01:0d:35:c4:85'
          command: button_4_short_release
        variables:
          preset_volume: 0.4
      - trigger: event
        id: volume_preset
        event_type: zha_event
        event_data:
          device_ieee: '00:17:88:01:0d:35:c4:85'
          command: '4_short_release'
        variables:
          preset_volume: 0.4
    conditions:
      - condition: not
        conditions:
          - condition: state
            entity_id: media_player.kitchen
            state:
              - unavailable
              - unknown
    actions:
      - choose:
          - conditions:
              - condition: trigger
                id: play_pause
            sequence:
              - action: media_player.media_play_pause
                target:
                  entity_id: media_player.kitchen
          - conditions:
              - condition: trigger
                id: volume_preset
            sequence:
              - if:
                  - condition: state
                    entity_id: media_player.kitchen
                    attribute: is_volume_muted
                    state: true
                then:
                  - action: media_player.volume_mute
                    target:
                      entity_id: media_player.kitchen
                    data:
                      is_volume_muted: false
              - action: media_player.volume_set
                target:
                  entity_id: media_player.kitchen
                data:
                  volume_level: "{{ preset_volume }}"
    # queued: presses are short and ordered; a quick 2-then-4 should land on
    # 40%, not drop the second press.
    mode: queued
    max: 5

  # ───────────────────────── GROUPING ─────────────────────────
  - id: hue_tap_dial_grouping_kitchen_sonos
    alias: 'Hue Tap Dial: long and multi-presses → Kitchen Sonos grouping'
    description: >-
      Long presses toggle one room in or out of the Kitchen's Sonos group
      (2 Dining Room, 3 Office) or leave the Kitchen solo (1); long 4 is
      unassigned. Double and triple on button 1 build the Kitchen + Dining
      Room and first-floor (Kitchen + Dining Room + Office) presets with the
      Kitchen as coordinator. Double on 2, 3 and 4 applies
      the 20 / 30 / 40% preset to the whole group. See the header for the
      full table and the #544 entity-id caveat.
    triggers:
      # ── button 1: solo / presets ──
      - trigger: event
        id: kitchen_solo
        event_type: zha_event
        event_data:
          device_ieee: '00:17:88:01:0d:35:c4:85'
          command: button_1_long_release
      - trigger: event
        id: preset
        event_type: zha_event
        event_data:
          device_ieee: '00:17:88:01:0d:35:c4:85'
          command: button_1_double_press
        variables:
          # Kitchen + Dining Room (the Kitchen is added by the preset itself).
          wanted:
            - media_player.dining_room
      - trigger: event
        id: preset
        event_type: zha_event
        event_data:
          device_ieee: '00:17:88:01:0d:35:c4:85'
          command: button_1_triple_press
        variables:
          # The first floor. media_player.office_office IS the Office Playbar
          # (#544). Only rooms within earshot of the kitchen belong here; the
          # Basement, bedroom and Roam stay off the list.
          wanted:
            - media_player.dining_room
            - media_player.office_office
      # ── buttons 2-3 long: toggle one room (long 4 is unassigned) ──
      - trigger: event
        id: toggle_room
        event_type: zha_event
        event_data:
          device_ieee: '00:17:88:01:0d:35:c4:85'
          command: button_2_long_release
        variables:
          room: media_player.dining_room
      - trigger: event
        id: toggle_room
        event_type: zha_event
        event_data:
          device_ieee: '00:17:88:01:0d:35:c4:85'
          command: button_3_long_release
        variables:
          room: media_player.office_office   # Office Playbar (#544)
      # ── buttons 2-4 double: group volume presets ──
      - trigger: event
        id: group_volume
        event_type: zha_event
        event_data:
          device_ieee: '00:17:88:01:0d:35:c4:85'
          command: button_2_double_press
        variables:
          preset_volume: 0.2
      - trigger: event
        id: group_volume
        event_type: zha_event
        event_data:
          device_ieee: '00:17:88:01:0d:35:c4:85'
          command: button_3_double_press
        variables:
          preset_volume: 0.3
      - trigger: event
        id: group_volume
        event_type: zha_event
        event_data:
          device_ieee: '00:17:88:01:0d:35:c4:85'
          command: button_4_double_press
        variables:
          preset_volume: 0.4
    conditions:
      - condition: not
        conditions:
          - condition: state
            entity_id: media_player.kitchen
            state:
              - unavailable
              - unknown
    variables:
      kitchen: media_player.kitchen
      # Volume every player gets when a preset forms the group. Tuning knob.
      preset_group_volume: 0.25
    actions:
      # Read the group when the run actually starts, not when it was queued,
      # so a second gesture right behind a join sees the joined topology.
      - variables:
          group: "{{ state_attr(kitchen, 'group_members') or [kitchen] }}"
      - choose:
          # ── Kitchen solo ──
          - conditions:
              - condition: trigger
                id: kitchen_solo
            sequence:
              - variables:
                  # Kitchen coordinating: the others leave. Kitchen following
                  # another room: the Kitchen leaves and that group plays on.
                  leavers: >-
                    {%- if group[0] == kitchen -%}
                      {{ group | reject('eq', kitchen) | list }}
                    {%- else -%}
                      {{ [kitchen] }}
                    {%- endif -%}
              - if:
                  - "{{ leavers | count > 0 }}"
                then:
                  - action: media_player.unjoin
                    target:
                      entity_id: "{{ leavers }}"
          # ── Toggle one room ──
          - conditions:
              - condition: trigger
                id: toggle_room
            sequence:
              - choose:
                  - conditions:
                      - "{{ room in group }}"
                    sequence:
                      - action: media_player.unjoin
                        target:
                          entity_id: "{{ room }}"
                  - conditions:
                      - "{{ states(room) not in ['unavailable', 'unknown'] }}"
                    sequence:
                      # Join the group's coordinator, not the Kitchen itself,
                      # so the room picks up whatever the Kitchen is hearing.
                      - action: media_player.join
                        target:
                          entity_id: "{{ group[0] }}"
                        data:
                          group_members:
                            - "{{ room }}"
          # ── Presets: Kitchen + Dining Room / first floor ──
          - conditions:
              - condition: trigger
                id: preset
            sequence:
              - variables:
                  members: >-
                    {{ expand(wanted)
                       | rejectattr('state', 'in', ['unavailable', 'unknown'])
                       | map(attribute='entity_id')
                       | reject('eq', kitchen) | list }}
                  # Rooms in the Kitchen's group that the preset does not name.
                  extras: "{{ group | reject('eq', kitchen) | reject('in', members) | list }}"
              # Exact set when the Kitchen coordinates: the extras leave first.
              # When the Kitchen follows another room, the join below pulls the
              # Kitchen out of that group and makes it the coordinator, so the
              # old group is left alone.
              - if:
                  - "{{ group[0] == kitchen and extras | count > 0 }}"
                then:
                  - action: media_player.unjoin
                    target:
                      entity_id: "{{ extras }}"
              # Level everyone before the join so nobody blasts at an old volume.
              - action: media_player.volume_mute
                target:
                  entity_id: "{{ [kitchen] + members }}"
                data:
                  is_volume_muted: false
              - action: media_player.volume_set
                target:
                  entity_id: "{{ [kitchen] + members }}"
                data:
                  volume_level: "{{ preset_group_volume }}"
              - if:
                  - "{{ members | count > 0 }}"
                then:
                  - action: media_player.join
                    target:
                      entity_id: media_player.kitchen
                    data:
                      group_members: "{{ members }}"
          # ── Group volume preset ──
          - conditions:
              - condition: trigger
                id: group_volume
            sequence:
              - action: media_player.volume_mute
                target:
                  entity_id: "{{ group }}"
                data:
                  is_volume_muted: false
              - action: media_player.volume_set
                target:
                  entity_id: "{{ group }}"
                data:
                  volume_level: "{{ preset_volume }}"
    # queued: a long press right after a double press should both land, in
    # order, each reading the topology the previous one left behind.
    mode: queued
    max: 5
