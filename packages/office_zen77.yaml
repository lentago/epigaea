# Zooz ZEN77 (Z-Wave 700-series dimmer) → Office lights scene controller
#
# Device:
#   name: Office Switch
#   manufacturer: Zooz
#   model: ZEN77
#   device_id: 51a69e120926a13bba9cfaac7a2937e7
#   integration: zwave_js
#   area: office
#
# Replaces the retired Signify RDM001 in-wall rocker (recycled).
#
# Instruction card: cards/office-wall-switch.html is the printed card posted
# by this switch (contract in cards/README.md). It also lists the scene catalog
# from packages/sonoff_button_office.yaml. Any change to the paddle behaviour
# below, or to that catalog, updates the card in the same PR.
#
# Z-Wave Central Scene events fire as `zwave_js_value_notification`:
#   property_key_name: '001'    = up paddle
#   property_key_name: '002'    = down paddle
#   value: KeyPressed           = single tap
#   value: KeyHeldDown          = held past ~1s threshold (ONE-SHOT — the
#                                 ramp automations loop internally until the
#                                 paired KeyReleased fires)
#   value: KeyReleased          = released after hold (also breaks the ramp)
#   value: KeyPressed2x..5x     = multi-tap (intentionally unhandled, reserved)
#
# Bindings:
#   up tap    → if lights off, reset counter to 1 and apply scene 1;
#               otherwise advance counter (wraps 9 → 1) and apply.
#               i.e. first tap turns on, subsequent taps cycle scenes.
#   down tap  → all 6 office lamps off (counter persists, candle loop killed).
#   up hold   → ramp the current scene brighter at 5%/~150 ms until the
#               paddle is released or 100% is reached. KeyHeldDown is a
#               single Z-Wave event per hold (verified empirically), so the
#               automation runs a repeat-loop that waits for the matching
#               KeyReleased to break out. apply_scene is called with
#               reset_brightness:false so the helper drives the render.
#   down hold → ramp dimmer the same way; floored at 10%.
#   To bail out of a colored/flicker scene back to scene 1, use the
#   Sonoff button's long-press, or tap down (off) then up (on → scene 1).
#
# Shared state with the Sonoff Button 2:
#   counter:  counter.office_sonoff_scene
#   apply:    script.office_sonoff_apply_scene
#   loop:     script.office_sonoff_candle_loop
# Both controllers read from and write to the same counter, so tapping
# either one continues from the same scene index. Single source of truth.
#
# Hardware setup (codified): The ZEN77 ships with both Scene Control and
# Smart Bulb Mode disabled. The `zen77_office_parameter_apply` automation
# at the bottom of this file enables them via zwave_js.set_config_parameter
# on every HA start and whenever the node returns to "alive", so a re-pair
# or backup-restore cannot leave the paddle inert.
#   * Scene Control = 1     → paddle emits Central Scene Notification reports
#   * Smart Switch Mode = 1 → internal relay decoupled from paddle (scene-only,
#                              load stays on so wired Hue bulbs keep power)

automation:
  - id: zen77_office_up_cycle
    alias: 'Office ZEN77: Up tap → office on / cycle scenes'
    triggers:
      - trigger: event
        event_type: zwave_js_value_notification
        event_data:
          device_id: 51a69e120926a13bba9cfaac7a2937e7
          command_class_name: Central Scene
          property_key_name: '001'
          value: KeyPressed
    conditions: []
    actions:
      - choose:
          - conditions:
              - condition: state
                entity_id: binary_sensor.office_lights_on
                state: 'off'
            sequence:
              - action: counter.set_value
                target:
                  entity_id: counter.office_sonoff_scene
                data:
                  value: 1
        default:
          - if:
              - condition: state
                entity_id: counter.office_sonoff_scene
                state: '9'
            then:
              - action: counter.set_value
                target:
                  entity_id: counter.office_sonoff_scene
                data:
                  value: 1
            else:
              - action: counter.increment
                target:
                  entity_id: counter.office_sonoff_scene
      - action: script.office_sonoff_apply_scene
    mode: single

  - id: zen77_office_down_off
    alias: 'Office ZEN77: Down tap → office lights OFF'
    triggers:
      - trigger: event
        event_type: zwave_js_value_notification
        event_data:
          device_id: 51a69e120926a13bba9cfaac7a2937e7
          command_class_name: Central Scene
          property_key_name: '002'
          value: KeyPressed
    conditions: []
    variables:
      # While a meeting is active, corner_lamp is owned by the meeting indicator
      # (packages/meeting_indicator.yaml) and stays out of office-off.
      office_lamps: >-
        {% set lamps = ['light.bookcase_lamp', 'light.door_lamp',
          'light.desk_lamp_2', 'light.desk_lamp_2_2', 'light.table_lamp'] %}
        {{ lamps if is_state('light.meeting_light', 'on')
           else lamps + ['light.corner_lamp'] }}
    actions:
      - action: script.turn_off
        target:
          entity_id: script.office_sonoff_candle_loop
      - action: light.turn_off
        target:
          entity_id: '{{ office_lamps }}'
    mode: single

  - id: zen77_office_up_hold_brighten
    alias: 'Office ZEN77: Up hold → brighten current scene'
    triggers:
      - trigger: event
        event_type: zwave_js_value_notification
        event_data:
          device_id: 51a69e120926a13bba9cfaac7a2937e7
          command_class_name: Central Scene
          property_key_name: '001'
          value: KeyHeldDown
    conditions:
      - condition: state
        entity_id: binary_sensor.office_lights_on
        state: 'on'
    # mode: restart so a fresh hold cancels any prior ramp instead of
    # queueing behind it. The repeat-loop steps the helper 5%/~150 ms
    # until the matching KeyReleased event fires or 100% is reached.
    mode: restart
    actions:
      - repeat:
          sequence:
            - action: input_number.set_value
              target:
                entity_id: input_number.office_brightness
              data:
                value: "{{ [(states('input_number.office_brightness') | float(0)) + 5, 100] | min }}"
            - action: script.office_sonoff_apply_scene
              data:
                reset_brightness: false
            - wait_for_trigger:
                - trigger: event
                  event_type: zwave_js_value_notification
                  event_data:
                    device_id: 51a69e120926a13bba9cfaac7a2937e7
                    command_class_name: Central Scene
                    property_key_name: '001'
                    value: KeyReleased
              timeout:
                milliseconds: 150
              continue_on_timeout: true
          until:
            - condition: template
              value_template: >-
                {{ wait.completed | default(false)
                   or (states('input_number.office_brightness') | float(0)) >= 100 }}

  - id: zen77_office_down_hold_dim
    alias: 'Office ZEN77: Down hold → dim current scene'
    triggers:
      - trigger: event
        event_type: zwave_js_value_notification
        event_data:
          device_id: 51a69e120926a13bba9cfaac7a2937e7
          command_class_name: Central Scene
          property_key_name: '002'
          value: KeyHeldDown
    conditions:
      - condition: state
        entity_id: binary_sensor.office_lights_on
        state: 'on'
    mode: restart
    actions:
      - repeat:
          sequence:
            - action: input_number.set_value
              target:
                entity_id: input_number.office_brightness
              data:
                value: "{{ [(states('input_number.office_brightness') | float(100)) - 5, 10] | max }}"
            - action: script.office_sonoff_apply_scene
              data:
                reset_brightness: false
            - wait_for_trigger:
                - trigger: event
                  event_type: zwave_js_value_notification
                  event_data:
                    device_id: 51a69e120926a13bba9cfaac7a2937e7
                    command_class_name: Central Scene
                    property_key_name: '002'
                    value: KeyReleased
              timeout:
                milliseconds: 150
              continue_on_timeout: true
          until:
            - condition: template
              value_template: >-
                {{ wait.completed | default(false)
                   or (states('input_number.office_brightness') | float(100)) <= 10 }}

  - id: zen77_office_parameter_apply
    alias: 'Office ZEN77: apply Z-Wave parameters (Scene Control + Smart Switch Mode)'
    description: >
      Idempotently sets the two Zooz ZEN77 configuration parameters that the
      device ships with disabled:
        * Scene Control = 1     — enable Central Scene reports on paddle taps
        * Smart Switch Mode = 1 — decouple the internal relay so the paddle is
                                  scene-only (load stays on, paddle drives
                                  scenes via the other three automations).
      Without these, the up/down/hold automations above are inert: paddle taps
      either fight us by cutting power, or never generate Central Scene events
      in the first place. Re-runs on every HA start and whenever the Z-Wave
      node returns to "alive" (covers radio dropouts and device re-pairs).
      Note: zwave_js.set_config_parameter is keyed by device_id by design —
      the service finds the underlying Z-Wave node, not an entity. This is the
      one place a device_id reference is the correct shape.
    triggers:
      - trigger: homeassistant
        event: start
      - trigger: state
        entity_id: sensor.office_switch_node_status
        to: alive
    conditions: []
    actions:
      - action: zwave_js.set_config_parameter
        data:
          device_id: 51a69e120926a13bba9cfaac7a2937e7
          parameter: Scene Control
          value: 1
      - action: zwave_js.set_config_parameter
        data:
          device_id: 51a69e120926a13bba9cfaac7a2937e7
          parameter: Smart Switch Mode
          value: 1
    mode: single
