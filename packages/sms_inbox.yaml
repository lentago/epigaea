# SMS inbox — a short-lived, local log of Chris's incoming texts, so an
# assistant can track texts the way it already tracks email. Claude reads it
# through the HA MCP server; the agent fleet reads a copy on the NAS.
#
# Source
# ------
# The Android companion app's "Last notification" sensor on Chris's phone
# (Galaxy S24+, model SM-S926U1): sensor.sm_s926u1_last_notification. Its
# allow list on the phone is set to Google Messages only
# (com.google.android.apps.messaging), and the template below checks the
# package again, so a notification from any other app is never logged even if
# the allow list is widened later.
#
# The source sensor holds only the latest notification, so a second text
# overwrites the first. This package keeps a rolling list instead:
#
#   sensor.sms_inbox             state = number of texts held;
#                                attribute `messages` = the texts, oldest
#                                first, each { received, posted, sender, text,
#                                hidden }
#   input_datetime.sms_inbox_read_through
#                                watermark: the reader sets it to the newest
#                                `received` it has handled, so the next read
#                                takes only what came after
#
# What counts as a text: Google Messages also posts notices about itself
# ("Device pairing", "Messages is doing work in the background", "Getting
# things ready…") and an empty group summary over each conversation. The
# companion app writes a missing field as the string "null". A notification is
# logged only when it is not a background notice (category "service" or
# ongoing), it has real text (not "null"), and it has a sender or is a hidden
# text (below). Titles in `noise_titles` are dropped, and the same checks run over
# the list already held, so notices logged before this filter clear on the
# next run instead of waiting 72 hours.
#
# Hidden texts: Android 15+ blanks a notification it judges sensitive (codes,
# unknown numbers) for third-party listeners; the text arrives as "Sensitive
# notification content hidden" with no sender. Those are kept with
# `hidden: true`, so the reader knows a text came in that it could not read.
# Turning off "Suggest actions and replies for notifications" on the phone
# stopped this on 2026-11-17.
#
# Retention: a text is dropped 72 hours after it arrived, and the list never
# holds more than 50. Pruning runs on every new text and every 15 minutes, so
# texts age out even when none arrive. The list survives an HA restart
# (trigger-based template entities restore their last state).
#
# Privacy boundary — message text stays in the house
# --------------------------------------------------
# Message text lives in HA's state machine and in one file on the NAS (The
# NAS copy, below). Three exclusions in configuration.yaml keep it from going
# anywhere else:
#   - recorder: the notification sensors and sensor.sms_inbox are excluded,
#     so no text reaches the history database, the logbook or long-term
#     statistics.
#   - prometheus: the same entities are filtered out of /api/prometheus, the
#     endpoint drosera's Alloy scrapes into Grafana Cloud.
#   - drosera's Alloy `ha_trim` relabel drops the same entities again as a
#     second line (lentago/drosera, ADR-0006 privacy-shaped egress).
# Read the list with ha_get_state, or read the NAS copy. Never copy it into
# git, context/, a dashboard, a notification, a log, or pub.lan (the NAS web/
# folder).
#
# Places the text can still travel, which no YAML here controls:
#   - HA backups include .storage/core.restore_state, which holds the last
#     value of sensor.sms_inbox (up to 72 hours of texts). Supervisor leaves
#     network mounts out of backups, so the NAS copy is not in them.
#   - When the phone is off the home network, the companion app sends sensor
#     updates through its cloudhook, which Nabu Casa relays (remote UI is on).
#   - Whatever reads the NAS copy (below).
#
# The NAS copy
# ------------
# The agent fleet's daily briefings read the texts from a file on the NAS, so
# no worker holds an HA token (Chris, 2026-11-17). The automation at the end
# of this file runs scripts/sms-inbox-export.sh on every change to
# sensor.sms_inbox, every 15 minutes and at HA start. It writes
# claude-jobs/sources/sms_inbox.json on the NAS `lentago` share:
#   HA            /share/claude_jobs/sources/sms_inbox.json
#   workers       /srv/jobs/sources/sms_inbox.json
#   workstation   /mnt/lentago/claude-jobs/sources/sms_inbox.json
# as { exported_at, messages }, where `messages` is the sensor's list unchanged.
#   - A mirror, not an archive: the file holds what the sensor holds, under the
#     same 72-hour, 50-text retention. An empty inbox is written as an empty
#     list. An unavailable sensor or a failed read leaves the last file in
#     place until that export is 72 hours old; then its texts have all expired,
#     and the next run empties `messages` and keeps the old exported_at. While
#     HA itself is down nothing runs, so the file keeps its last contents,
#     possibly older than 72 hours, until HA is back. A reader checks
#     exported_at.
#   - Entries are copied unchanged, `hidden` included. `hidden: true` marks a
#     text Android blanked before HA saw it: its text is the placeholder
#     "Sensitive notification content hidden", not the message, so the file
#     tells a reader a text arrived without saying what it said.
#   - Any LAN client with credentials for the share can read it; Chris
#     accepted that on 2026-11-17. It is never under web/, which pub.lan
#     serves to the whole LAN without credentials.
#   - Write-then-rename, never in place, and never a delete. The share's Samba
#     recycle bin keeps every deleted file, so a delete would keep a copy of
#     the texts past 72 hours. To retire the export: remove the automation,
#     delete the file on the NAS, then delete it from #recycle too.
#   - The automation stores no traces (a trace would hold the whole list), and
#     the script never prints or logs message text.
#   - Every claytonia job can read /srv/jobs. A job that reads the file
#     carries the texts into its transcript (logs/<runid>.transcript.jsonl on
#     the same share, kept past 72 hours); a job with a public workroot also
#     streams the transcript to Grafana Cloud, and a Gemini or Codex job sends
#     what it reads to that vendor. A reader should run as a registered
#     project with "offbox_transcript": false, on runtime claude.
#   - Mounting the share on HAOS is Supervisor config, not YAML. The steps are
#     in docs/sms-inbox-nas-export.md.
#
# Do NOT enable the companion app's "Active notification count" sensor: it has
# no allow list and its attributes carry the text of every app's notifications.
# It is excluded below anyway, in case it is ever switched on.
#
# Chris directs and reviews this package; Claude writes the code.

input_datetime:
  sms_inbox_read_through:
    name: SMS inbox read through
    icon: mdi:message-check-outline
    has_date: true
    has_time: true

template:
  - triggers:
      - trigger: state
        entity_id: sensor.sm_s926u1_last_notification
        # No `to:` — the state is the notification text, so a repeated text
        # leaves the state unchanged and only the attributes (post_time)
        # move. A bare state trigger fires on attribute changes too.
        id: text
      - trigger: time_pattern
        minutes: "/15"
        id: prune
    actions:
      - variables:
          max_age_hours: 72
          max_messages: 50
          hidden_marker: Sensitive notification content hidden
          noise_titles:
            - Device pairing
            - Getting things ready…
          # The previous list is read from the state machine rather than
          # `this`, because `this` is not available in a template entity's
          # actions. Renaming sensor.sms_inbox means updating this line.
          messages: >-
            {% set ns = namespace(out=[]) %}
            {% set cutoff = now() - timedelta(hours=max_age_hours) %}
            {% set prior = state_attr('sensor.sms_inbox', 'messages') %}
            {% if prior is not iterable or prior is string or prior is mapping %}
              {% set prior = [] %}
            {% endif %}
            {% for m in prior %}
              {% set at = as_datetime(m.get('received', ''), none) if m is mapping else none %}
              {% set t = m.get('text') if m is mapping else none %}
              {% set who = m.get('sender') if m is mapping else none %}
              {% set real = t not in [none, '', 'null']
                   and who not in noise_titles
                   and (who not in [none, '', 'null'] or t == hidden_marker) %}
              {% if at is not none and at > cutoff and real %}
                {% set ns.out = ns.out + [m] %}
              {% endif %}
            {% endfor %}
            {% set s = trigger.to_state if trigger.id == 'text' else none %}
            {% set t = s.attributes.get('android.text') if s is not none else none %}
            {% set who = s.attributes.get('android.title') if s is not none else none %}
            {% set who = none if who in ['', 'null'] else who %}
            {% if s is not none
                  and s.attributes.get('package') == 'com.google.android.apps.messaging'
                  and s.attributes.get('category') != 'service'
                  and s.attributes.get('is_ongoing') not in [true, 'true']
                  and t not in [none, '', 'null']
                  and who not in noise_titles
                  and (who is not none or t == hidden_marker) %}
              {% set new = {
                'received': now().isoformat(),
                'posted': s.attributes.get('post_time'),
                'sender': who,
                'text': t,
                'hidden': t == hidden_marker
              } %}
              {% set dup = ns.out
                   | selectattr('posted', 'eq', new.posted)
                   | selectattr('sender', 'eq', new.sender)
                   | selectattr('text', 'eq', new.text)
                   | list | count > 0 %}
              {% if not dup %}
                {% set ns.out = ns.out + [new] %}
              {% endif %}
            {% endif %}
            {{ ns.out[-max_messages:] }}
    sensor:
      - name: SMS inbox
        unique_id: sms_inbox
        icon: mdi:message-text-outline
        state: "{{ messages | count }}"
        attributes:
          messages: "{{ messages }}"
          retention: "{{ max_age_hours }}h, newest {{ max_messages }}"

# The NAS copy (header, "The NAS copy"). The command line carries only the
# export directory, never a template: the script reads the sensor through the
# Core API itself, so no message text passes through a shell string.
shell_command:
  sms_inbox_export: "bash /config/scripts/sms-inbox-export.sh /share/claude_jobs/sources"

automation:
  - id: sms_inbox_export
    alias: "SMS inbox: export to the NAS"
    description: >-
      Mirrors sensor.sms_inbox to sources/sms_inbox.json on the NAS job share
      for the agent fleet. See packages/sms_inbox.yaml, "The NAS copy".
    # One run at a time and at most one waiting: each run reads the sensor's
    # current state, so a waiting run already covers any later trigger.
    mode: queued
    max: 2
    max_exceeded: silent
    # No traces. A trace keeps the trigger's to_state, which is the whole
    # message list, in memory and in .storage/trace.saved_traces.
    trace:
      stored_traces: 0
    triggers:
      # No `to:`. The list lives in the `messages` attribute, and a text in
      # with a text out leaves the count unchanged.
      - trigger: state
        entity_id: sensor.sms_inbox
      # Heartbeat, 30 s after the template's prune tick: keeps exported_at
      # fresh, so a reader can tell a stalled export from a quiet inbox, and
      # retries a failed write.
      - trigger: time_pattern
        minutes: "/15"
        seconds: 30
      - trigger: homeassistant
        event: start
    actions:
      - action: shell_command.sms_inbox_export
