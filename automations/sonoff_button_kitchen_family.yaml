# device_ieee f0:44:d3:ff:fe:f6:94:01 = Sonoff Button 1 (downstairs)
#
# Instruction card: cards/downstairs-lights-button.html is the printed card
# posted by this button (contract in cards/README.md). Any change to the
# presses below updates the card in the same PR.
- id: sonoff_button_1_kitchen_family_on
  alias: 'Sonoff Button 1: Single press → Downstairs + Hallways ON'
  triggers:
  - trigger: event
    event_type: zha_event
    event_data:
      device_ieee: f0:44:d3:ff:fe:f6:94:01
      command: toggle
  conditions: []
  actions:
  - action: light.turn_on
    data:
      brightness: 255
    target:
      entity_id:
        - group.downstairs_lights
        - light.downstairs_hallway
        - light.upstairs_hallway_light
  - action: switch.turn_on
    target:
      entity_id: switch.family_room_outlets
  mode: single
- id: sonoff_button_1_kitchen_family_off
  alias: 'Sonoff Button 1: Double press → Downstairs + Hallways OFF'
  triggers:
  - trigger: event
    event_type: zha_event
    event_data:
      device_ieee: f0:44:d3:ff:fe:f6:94:01
      command: "on"
  conditions: []
  actions:
  - action: homeassistant.turn_off
    target:
      entity_id:
        - group.downstairs_lights
        - light.downstairs_hallway
        - light.upstairs_hallway_light
  - action: switch.turn_off
    target:
      entity_id: switch.family_room_outlets
  mode: single
- id: sonoff_button_1_kitchen_family_dim
  alias: 'Sonoff Button 1: Long press → Downstairs + Hallways 25%'
  triggers:
  - trigger: event
    event_type: zha_event
    event_data:
      device_ieee: f0:44:d3:ff:fe:f6:94:01
      command: "off"
  conditions: []
  actions:
  - action: light.turn_on
    data:
      brightness_pct: 25
    target:
      entity_id:
        - group.downstairs_lights
        - light.downstairs_hallway
        - light.upstairs_hallway_light
  - action: switch.turn_on
    target:
      entity_id: switch.family_room_outlets
  mode: single
